<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimeMax Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Officiële Supabase Browser Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { background: #080808; color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .accent { color: #cae962; }
        .bg-accent { background: #cae962; color: #000; }
        .glass { background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card { background: #121212; border-radius: 18px; border: 1px solid rgba(255,255,255,0.03); transition: 0.2s; }
        .card:hover { border-color: rgba(202, 233, 98, 0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Toggle Switch */
        .toggle-checkbox:checked + .toggle-bg { background-color: #cae962; }
        .toggle-checkbox:checked + .toggle-bg .toggle-dot { transform: translateX(100%); background-color: #000; }
        
        /* Toast Container perfect gecentreerd en mobiel vriendelijk */
        #toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 360px;
            z-index: 10000;
            pointer-events: none;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-toast { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="pb-32 relative">

    <!-- Toast Meldingen Container -->
    <div id="toast-container" class="flex flex-col gap-2"></div>

    <!-- Bevestigingsmodal -->

        <div class="bg-[#121212] border border-white/5 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h3 id="confirm-title" class="text-lg font-black uppercase tracking-wider mb-2">Bevestigen</h3>
            <p id="confirm-message" class="text-zinc-400 text-xs leading-relaxed mb-6"></p>
            <div class="flex gap-3">
                <button id="confirm-cancel-btn" class="flex-1 bg-zinc-900 border border-white/5 py-3 rounded-xl text-xs font-black uppercase">Annuleren</button>
                <button id="confirm-ok-btn" class="flex-1 bg-accent text-black py-3 rounded-xl text-xs font-black uppercase">Bevestigen</button>
            </div>
        </div>
    </div>

    <!-- Header (Zichtbaar na inloggen) -->
    <header id="app-header" class="sticky top-0 z-50 glass p-4 hidden">
        <div class="flex items-center justify-between max-w-4xl mx-auto mb-2">
            <button onclick="nav('home')" class="text-2xl font-black italic uppercase tracking-tighter">ANIME<span class="accent">MAX</span></button>
            <div class="flex gap-3 items-center">
                <button onclick="nav('search')" class="w-10 h-10 rounded-full bg-[#121212] flex items-center justify-center border border-white/5"><i class="fa-solid fa-search text-xs"></i></button>
                <button onclick="nav('profile')" id="prof-btn" class="w-10 h-10 rounded-full bg-[#121212] flex items-center justify-center border border-white/10 text-zinc-600">
                    <i class="fa-solid fa-user-astronaut"></i>
                </button>
                <button onclick="logout()" class="w-10 h-10 rounded-full bg-red-950/40 hover:bg-red-900 border border-red-900/30 flex items-center justify-center text-red-400 transition-colors" title="Uitloggen"><i class="fa-solid fa-sign-out-alt text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- Hoofdinhoud -->
    <main id="content" class="p-4 max-w-4xl mx-auto min-h-[60vh]">
        <div class="text-center py-24">
            <i class="fa-solid fa-circle-notch animate-spin text-4xl accent mb-4"></i>
            <p class="text-xs uppercase tracking-widest text-zinc-500 animate-pulse">Laden en cloud-database verbinden...</p>
        </div>
    </main>

    <!-- Bottom Navigatiebalk -->
    <nav id="app-navigation" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[94%] max-w-md glass rounded-[2.5rem] p-2 flex justify-around items-center shadow-2xl z-[100] border border-white/10 hidden">
        <button onclick="nav('home')" class="p-4 nav-link" id="nav-home" title="Home"><i class="fa-solid fa-house"></i></button>
        <button onclick="nav('recent')" class="p-4 nav-link" id="nav-recent" title="Verder Kijken"><i class="fa-solid fa-clock-rotate-left"></i></button>
        <button onclick="nav('library')" class="p-4 nav-link" id="nav-library" title="Bibliotheek"><i class="fa-solid fa-layer-group"></i></button>
        <button onclick="nav('profile')" class="p-4 nav-link" id="nav-profile" title="Profiel & Instellingen"><i class="fa-solid fa-user-ninja"></i></button>
    </nav>

    <script>
        const ANILIST_API = 'https://graphql.anilist.co';
        
        // Gekoppelde Supabase Database instellingen!
        const SUPABASE_URL = "https://zieuivzmzzxbraefeovl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EpN5OqgyzVvorrR27-V2MA_ZPCnD7He";
        
        let sb = null;
        let sessionData = null;
        let saveInterval = null;
        let saveTimeout = null;
        let dubTimeout = null;

        // Globale App Toestand
        let app = {
            view: 'home', id: null, ep: 1, mode: 'sub', searchQuery: '', libraryFilter: 'All',
            user: 'Kozjo09', showContinue: true, lang: 'english', autoPlay: true, autoNext: true, autoSkipIntro: false, skipSeconds: 5, 
            defaultAudio: 'sub', recent: [], xmlLib: []
        };

        // Trackt de exacte afspeeltijd van de active video lokaal
        let currentPlaybackTime = 0;
        let currentDuration = 0;

        // Cache voor MyAnimeList metadata om herhaaldelijk inladen te voorkomen
        let malCache = {};

        // Statische Trending Now Back-uplijst (Laadt ALTIJD direct, 100% rate-limit-proof)
        const STATIC_TRENDING = [
            { id: 147105, title: "Witch Hat Atelier", img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx147105-X98uGbyg64gD.png" },
            { id: 186333, title: "Kunon the Sorcerer Can See", img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx186333-eWzW9l5y4Q5Z.png" },
            { id: 191205, title: "Easygoing Territory Defense", img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx191205-b3eF9YJ5K2Zq.png" },
            { id: 185993, title: "Noble Reincarnation", img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx185993-9qG4l8Y3K4Za.png" },
            { id: 172019, title: "Dr. Stone: Science Future", img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx172019-9uR6zG1yY2a5.png" },

            { id: 137822, title: "Blue Lock", img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx137822-7tI8bK2zY3b6.png" },

            { id: 154587, title: "Frieren: Beyond Journey's End", img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx154587-9oT6uY1yH5Za.png" },
            { id: 143327, title: "MF Ghost", img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx143327-7oK5uY1zW4Zb.png" },
            { id: 161645, title: "The Apothecary Diaries", img: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx161645-9oR6uG1yK2Za.png" }
        ];

        // --- CUSTOM TOAST NOTIFICATIES ---
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-between shadow-2xl border text-center animate-toast pointer-events-auto w-full ${
                type === 'error' ? 'bg-red-950/95 text-red-400 border-red-500/20' : 'bg-zinc-900/95 text-accent border-accent/20'
            }`;
            toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="ml-4 opacity-50 hover:opacity-100"><i class="fa-solid fa-times"></i></button>`;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
        };

        window.showConfirm = function(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const titleEl = document.getElementById('confirm-title');
            const messageEl = document.getElementById('confirm-message');
            const cancelBtn = document.getElementById('confirm-cancel-btn');
            const okBtn = document.getElementById('confirm-ok-btn');

            titleEl.textContent = title;
            messageEl.textContent = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const close = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            };

            cancelBtn.onclick = () => close();
            okBtn.onclick = () => { close(); onConfirm(); };
        };

        // --- URL HASH ROUTING EN STATE MANAGER ---
        function syncStateToUrl() {
            let hash = `#${app.view}`;
            if (app.id) {
                hash += `?id=${app.id}`;
                if (app.ep) {
                    hash += `&ep=${app.ep}`;
                }
            }
            if (window.location.hash !== hash) {
                history.replaceState(null, null, hash);
            }
        }

        function restoreStateFromUrl() {
            const hash = window.location.hash;
            if (!hash || hash === '#') {
                app.view = 'home';
                app.id = null;
                app.ep = 1;
                return;
            }

            const parts = hash.substring(1).split('?');
            app.view = parts[0] || 'home';
            app.id = null;
            app.ep = 1;

            if (parts[1]) {
                const params = new URLSearchParams(parts[1]);
                if (params.has('id')) {
                    app.id = params.get('id');
                }
                if (params.has('ep')) {
                    app.ep = parseInt(params.get('ep') || '1');
                }
            }
        }

        window.onhashchange = () => {
            restoreStateFromUrl();
            render();
        };

        // --- INITIALISATIE MET RLS EN AUTH ---
        window.onload = async () => {
            try {
                if (typeof window.supabase !== 'undefined') {
                    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                } else if (typeof supabase !== 'undefined') {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                } else {
                    throw new Error("Supabase library niet geladen");
                }

                const { data: { session } } = await sb.auth.getSession();
                if (session) {
                    sessionData = session;
                    if(session.user && session.user.email) {
                        app.user = session.user.email.split('@')[0];
                    }
                    restoreStateFromUrl();
                    await loadCloudData();
                } else {
                    showLoginPage('login');
                }
            } catch(e) {
                console.error("Database initialisatiefout: ", e);
                showLoginPage('login');
            }
        };

        // --- INLOGGEN EN REGISTREREN ---
        function showLoginPage(mode = 'login') {
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('app-navigation').classList.add('hidden');
            const main = document.getElementById('content');
            if(!main) return;
            
            if (mode === 'register') {
                main.innerHTML = `
                    <div class="max-w-md mx-auto mt-16 p-8 card border border-white/5 shadow-2xl animate-fade-in">
                        <h2 class="text-3xl font-black italic accent uppercase tracking-tighter mb-2 text-center">ANIME<span class="text-white">MAX</span></h2>
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest text-center mb-8">Maak een nieuw cloud-profiel aan</p>
                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] font-black uppercase text-zinc-400 block mb-1">Gebruikersnaam</label>
                                <input type="text" id="auth-username" class="w-full bg-zinc-900 border border-white/5 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                            </div>
                            <div>
                                <label class="text-[10px] font-black uppercase text-zinc-400 block mb-1">Wachtwoord</label>
                                <input type="password" id="auth-password" class="w-full bg-zinc-900 border border-white/5 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                            </div>
                            <button onclick="handleAuth('reg')" class="bg-accent text-black font-black py-4 rounded-xl w-full text-xs uppercase tracking-widest">Account Aanmaken</button>
                            <p class="text-center text-xs text-zinc-500 mt-4">Heb je al een account? <button onclick="showLoginPage('login')" class="accent font-bold hover:underline">Inloggen</button></p>
                        </div>
                    </div>
                `;
            } else {
                main.innerHTML = `
                    <div class="max-w-md mx-auto mt-16 p-8 card border border-white/5 shadow-2xl animate-fade-in">
                        <h2 class="text-3xl font-black italic accent uppercase tracking-tighter mb-2 text-center">ANIME<span class="text-white">MAX</span></h2>
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest text-center mb-8">Log in op je cloud-profiel</p>
                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] font-black uppercase text-zinc-400 block mb-1">Gebruikersnaam</label>
                                <input type="text" id="auth-username" class="w-full bg-zinc-900 border border-white/5 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                            </div>
                            <div>
                                <label class="text-[10px] font-black uppercase text-zinc-400 block mb-1">Wachtwoord</label>
                                <input type="password" id="auth-password" class="w-full bg-zinc-900 border border-white/5 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                            </div>
                            <button onclick="handleAuth('login')" class="bg-accent text-black font-black py-4 rounded-xl w-full text-xs uppercase tracking-widest">Inloggen</button>
                            <p class="text-center text-xs text-zinc-500 mt-4">Nieuwe gebruiker? <button onclick="showLoginPage('register')" class="accent font-bold hover:underline">Registreer hier</button></p>
                        </div>
                    </div>
                `;
            }
        }

        async function handleAuth(type, explicitUser = null, explicitPass = null) {
            const u = explicitUser || document.getElementById('auth-username').value.trim();
            const p = explicitPass || document.getElementById('auth-password').value.trim();
            if (!u || !p) return window.showToast("Vul alle velden in!", "error");

            const email = `${u.toLowerCase()}@animemax.local`;
            app.user = u; 

            if (type === 'reg') {
                const { data, error } = await sb.auth.signUp({ email, password: p });
                if (error) {
                    window.showToast("Registratie mislukt of naam bezet.", "error");
                    return;
                }
                
                if (data.user) {
                    const { error: insertErr } = await sb.from('anime_users').insert([{
                        id: data.user.id, username: u, watchlist: [], recent: []
                    }]);
                    if(insertErr) console.error("Profiel insert fout:", insertErr);
                }
                window.showToast("Geregistreerd! Je kunt nu inloggen.");
                showLoginPage('login');
            } else {
                const { data, error } = await sb.auth.signInWithPassword({ email, password: p });
                if (error) {
                    window.showToast("Gebruikersnaam of wachtwoord onjuist.", "error");
                    return;
                }
                sessionData = data.session;
                await loadCloudData();
            }
        }

        async function loadCloudData() {
            if (!sessionData) return;
            const { data, error } = await sb.from('anime_users').select('*').eq('id', sessionData.user.id).single();
            
            if (data) {
                app.xmlLib = data.watchlist || [];
                app.recent = data.recent || [];
                if (data.settings) {
                    app.defaultAudio = data.settings.defaultAudio || 'sub';
                    app.mode = app.defaultAudio; 
                    app.user = data.settings.user || app.user;
                    app.showContinue = data.settings.showContinue !== false;
                    app.lang = data.settings.lang || 'english';
                    app.autoPlay = data.settings.autoPlay !== false;
                    app.autoNext = data.settings.autoNext !== false;
                    app.autoSkipIntro = data.settings.autoSkipIntro === true;
                    app.skipSeconds = parseInt(data.settings.skipSeconds || '5');
                }
            }

            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('app-navigation').classList.remove('hidden');
            window.showToast(`Welkom terug, ${app.user}!`);
            
            render();
        }

        async function saveCloudData() {
            if (!sessionData) return;
            const { error } = await sb.from('anime_users').update({
                watchlist: app.xmlLib,
                recent: app.recent,
                settings: {
                    defaultAudio: app.defaultAudio,
                    user: app.user,
                    showContinue: app.showContinue,
                    lang: app.lang,
                    autoPlay: app.autoPlay,
                    autoNext: app.autoNext,
                    autoSkipIntro: app.autoSkipIntro,
                    skipSeconds: app.skipSeconds
                }
            }).eq('id', sessionData.user.id);
            if (error) console.error("Cloud opslaan mislukt:", error);
        }

        function saveCloudDataDebounced() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveCloudData();
            }, 1000);
        }

        async function logout() {
            await sb.auth.signOut();
            sessionData = null;
            window.location.hash = ''; 
            showLoginPage('login');
        }

        // --- GRAPHQL API CALL HELPER ---
        async function gql(query, vars) {
            const headers = { 'Content-Type': 'application/json' };
            try {
                const r = await fetch(ANILIST_API, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ query, variables: vars })
                });
                return await r.json();
            } catch(e) {
                console.error("GraphQL API Fout: ", e);
                return null;
            }
        }

        // --- INTELLIGENTE RETRY EN TIMEOUT FETCH ENGINE (MAL/Jikan API) ---
        async function fetchWithRetry(url, retries = 3, delay = 1000) {
            try {
                const response = await fetch(url);
                if (response.status === 429) { 
                    throw new Error("429");
                }
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                if (retries > 0) {
                    console.log(`Verzoek mislukt of rate-limited. Retry over ${delay}ms...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(url, retries - 1, delay * 2.5); 
                }
                throw error;
            }
        }

        // --- SUPABASE SHARED CACHE ENGINE (Laadt instant voor iedereen!) ---
        async function getMetadataFromGlobalCache(id) {
            if (!id) return null;
            try {
                const { data, error } = await sb.from('anime_metadata').select('*').eq('id', id.toString()).maybeSingle();
                if (data) {
                    return {
                        episodes: data.episodes,
                        coverImage: data.cover_image
                    };
                }
            } catch (e) {
                console.warn("Fout bij lezen uit gedeelde cache-tabel:", e);
            }
            return null;
        }

        async function saveMetadataToGlobalCache(id, title, episodes, coverImage) {
            if (!id || !coverImage) return;
            try {
                await sb.from('anime_metadata').upsert({
                    id: id.toString(),
                    title: title || '',
                    episodes: episodes || 12,
                    cover_image: coverImage
                });
            } catch (e) {
                console.warn("Fout bij opslaan in gedeelde cache-tabel:", e);
            }
        }

        // --- EXCLUSIEVE MYANIMELIST (MAL) METADATA FETCH (Rate-Limit & Timeout Safe!) ---
        async function fetchMyAnimeListMetadata(id, malId, title) {
            const cacheKey = id || malId || title;
            if (!cacheKey) return null;
            if (mediaCache[cacheKey]) return mediaCache[cacheKey];

            const globalCache = await getMetadataFromGlobalCache(id || malId);
            if (globalCache) {
                mediaCache[cacheKey] = globalCache;
                return globalCache;
            }

            try {
                let url = '';
                if (malId) {
                    url = `https://api.jikan.moe/v4/anime/${malId}`;
                } else if (title) {
                    url = `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(title)}&limit=1`;
                } else {
                    return null;
                }

                const json = await fetchWithRetry(url, 3, 1000);
                let data = null;
                
                if (malId && json && json.data) {
                    data = json.data;
                } else if (json && json.data && json.data.length > 0) {
                    data = json.data[0];
                }

                if (data) {
                    const result = {
                        episodes: data.episodes || 12,
                        coverImage: data.images.jpg.large_image_url || data.images.jpg.image_url
                    };
                    
                    mediaCache[cacheKey] = result;
                    saveMetadataToGlobalCache(id || malId || data.mal_id, title || data.title, result.episodes, result.coverImage);
                    
                    return result;
                }
            } catch (e) {
                console.warn(`MyAnimeList/Jikan rate-limited voor: ${title}`, e);
            }
            return null;
        }

        // --- NAVIGATIE & CLEANUP ---
        function nav(view, params = {}) {
            if (!sessionData) return showLoginPage('login');
            
            if (app.view === 'watch' && app.id) {
                saveCurrentVideoTime();
            }
            if (saveInterval) {
                clearInterval(saveInterval);
                saveInterval = null;
            }
            if (dubTimeout) {
                clearTimeout(dubTimeout);
                dubTimeout = null;
            }
            if (lazyObserver) {
                lazyObserver.disconnect();
                lazyObserver = null;
            }

            app.view = view;
            app.id = params.id || null;
            app.ep = params.ep || 1;
            
            if (view === 'watch') {
                app.mode = app.defaultAudio;
                currentPlaybackTime = 0;
                currentDuration = 0;
            }
            
            // Sync direct met de URL hash zodat verversen werkt!
            syncStateToUrl();
            render();
            window.scrollTo(0,0);
        }

        // --- VERDER KIJKEN (RESUME) LOGICA ---
        function saveCurrentVideoTime() {
            if (app.view !== 'watch' || !app.id) return;
            
            let rec = app.recent.filter(i => i.id != app.id);
            const currentItem = app.recent.find(i => i.id == app.id);
            const img = currentItem ? currentItem.img : '';
            const title = currentItem ? currentItem.title : 'Anime';

            rec.unshift({
                id: app.id,
                title: title,
                img: img,
                ep: app.ep,
                time: currentPlaybackTime,
                duration: currentDuration,
                ts: Date.now()
            });
            app.recent = rec.slice(0, 12);
            saveCloudDataDebounced();
        }

        function saveRecent(id, title, img, ep) {
            let rec = app.recent.filter(i => i.id != id);
            const existing = app.recent.find(i => i.id == id);
            
            const savedTime = (existing && existing.ep == ep) ? existing.time : 0;
            const savedDuration = (existing && existing.ep == ep) ? existing.duration : 0;

            rec.unshift({
                id, title, img, ep, time: savedTime, duration: savedDuration, ts: Date.now()
            });
            app.recent = rec.slice(0, 12);
            saveCloudDataDebounced();
        }

        // --- SLIMME AUTO WATCHLIST & PROGRESSIE SPREIDING (ZONDER KNOPPEN) ---
        window.autoUpdateProgressOnEpClick = function(id, title, newEpisode, totalEpisodes, coverImage) {
            let found = false;
            let finalStatus = "Watching";

            if (parseInt(newEpisode) >= parseInt(totalEpisodes)) {
                finalStatus = "Watched";
            }

            app.xmlLib = app.xmlLib.map(item => {
                if (item.id == id) {
                    found = true;
                    return { ...item, status: finalStatus, progress: parseInt(newEpisode), episodes: totalEpisodes, coverImage };
                }
                return item;
            });

            if (!found) {
                app.xmlLib.push({ id: id.toString(), title, status: finalStatus, progress: parseInt(newEpisode), episodes: totalEpisodes, coverImage });
            }

            saveCloudDataDebounced();
            window.showToast(`Opgeslagen: Ep ${newEpisode} (${finalStatus})`);
        };

            if (app.mode === 'dub') {

        // --- INTELLIGENTE WATCHLIST SAMENVOEG LOGICA ---
        function mergeWatchlists(existing, incoming) {
            let merged = [...existing];
            incoming.forEach(incItem => {
                let idx = merged.findIndex(estItem => estItem.id.toString() == incItem.id.toString());
                if (idx !== -1) {
                    let existingProgress = parseInt(merged[idx].progress || 0);
                    let incomingProgress = parseInt(incItem.progress || 0);
                    if (incomingProgress > existingProgress) {
                        merged[idx].progress = incomingProgress;
                        merged[idx].status = incItem.status; 
                    }
                } else {
                    merged.push(incItem);
                }
            });
            return merged;
        }

        // --- EENMALIGE ANILIST CLOUD-LIST IMPORT & AUTOMATISCHE MERGE ---
        window.importAndMergeAniListCloud = async function() {
            if (!app.user) {
                window.showToast("Stel eerst een AniList gebruikersnaam in!", "error");
                return;
            }
            
            window.showToast("AniList watchlist ophalen...");
            
            try {
                const res = await gql(`query($u:String){MediaListCollection(userName:$u,type:ANIME){lists{name entries{progress media{id title{romaji english}coverImage{large}episodes}}}}}`, {u: app.user});
                
                if (res && res.data && res.data.MediaListCollection) {
                    let importedList = [];
                    res.data.MediaListCollection.lists.forEach(l => {
                        const listName = l.name.toLowerCase();
                        let statusStr = "Watching";
                        if (listName.includes("completed")) statusStr = "Watched";
                        if (listName.includes("dropped")) statusStr = "Dropped";
                        if (listName.includes("plan to watch") || listName.includes("planning")) statusStr = "Plan to Watch";

                        l.entries.forEach(e => {
                            importedList.push({
                                id: e.media.id.toString(),
                                title: e.media.title.english || e.media.title.romaji,
                                status: statusStr,
                                progress: parseInt(e.progress || 0),
                                episodes: parseInt(e.media.episodes || 12),
                                coverImage: e.media.coverImage.large
                            });
                        });
                    });

                    app.xmlLib = mergeWatchlists(app.xmlLib, importedList);
                    saveCloudData();
                    window.showToast(`Succesvol ${importedList.length} items geïmporteerd & samengevoegd!`);
                    nav('library');
                } else {
                    window.showToast("Kon geen openbare AniList vinden voor " + app.user, "error");
                }
            } catch (e) {
                window.showToast("Samenvoegen mislukt wegens rate limit.", "error");
            }
        };

                                <p class="text-[9px] text-zinc-500 uppercase mb-6 leading-relaxed">Exporteer je cloud-database als een universeel XML-bestand compatibel met HiAnime!</p>
                                <button onclick="exportMyAnimeListXML()" class="block w-full bg-zinc-900 hover:bg-accent hover:text-black text-white font-black py-4 rounded-xl text-[10px] uppercase tracking-widest border border-white/15 transition-all">
                                    <i class="fa-solid fa-file-export mr-1.5"></i> Download XML Back-up
                                </button>
                            </div>

                            <!-- XML Upload (MAL of HiAnime met automatische merge-prioriteit!) -->
                            <div class="card p-8 border border-white/5 text-center">
                                <h2 class="font-black uppercase mb-4 text-sm">Import XML / JSON Watchlist (HiAnime & MAL)</h2>
                                <input type="file" id="xml-input" class="text-[10px] text-zinc-500 mb-6 block mx-auto">
                                <button onclick="handleXML()" class="w-full bg-zinc-800 py-3.5 rounded-lg text-[10px] font-black uppercase border border-white/10">Upload Database & Merge</button>
                            </div>
                        </div>
                    `;
                }

                else if (app.view === 'library') {
                    main.innerHTML = `
                        <div class="flex items-center justify-between mb-4 flex-wrap gap-2 animate-fade-in">
                            <h2 class="text-xl font-black accent uppercase italic">Local Library</h2>
                            <span class="text-[10px] text-zinc-500 uppercase font-black">${app.xmlLib.length} items</span>
                        </div>

                        <!-- Horizontale Filters -->
                        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-4 mb-4">
                            <button onclick="filterXml('All')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'All' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">All</button>
                            <button onclick="filterXml('Watching')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'Watching' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Watching</button>
                            <button onclick="filterXml('Watched')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'Watched' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Completed</button>
                            <button onclick="filterXml('Dropped')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'Dropped' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Dropped</button>
                        </div>

                        <div id="xml-display-grid" class="space-y-4 mt-2">Laden...</div>
                    `;

                    renderLibraryGrid();
                }

                else if (app.view === 'search') {
                    main.innerHTML = `
                        <div class="max-w-md mx-auto mb-10">
                            <input type="text" id="live-search" placeholder="Zoek op titel..." onkeyup="liveSearch(event)" class="w-full bg-zinc-900/50 border border-white/10 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                        </div>
                        <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-6 gap-3"></div>
                    `;
                }

                else {
                    // HOME VIEW (Uitsluitend Trending met directe static-load!)
                    main.innerHTML = `
                        <h2 class="text-xs font-black uppercase tracking-widest mb-6">Trending Now</h2>
                        <div id="h-grid" class="grid grid-cols-2 sm:grid-cols-6 gap-3"></div>
                    `;
                    
                    const grid = document.getElementById('h-grid');
                    
                    STATIC_TRENDING.forEach(m => {
                        grid.innerHTML += `
                            <button onclick="nav('watch', {id:${m.id}})" class="text-left group animate-fade-in">
                                <div class="aspect-[2/3] rounded-xl overflow-hidden mb-2 border border-white/5">
                                    <img src="${m.img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                                </div>
                                <p class="text-[9px] font-black uppercase truncate leading-none px-1 text-zinc-400 group-hover:text-white transition-colors">${m.title}</p>
                            </button>
                        `;
                    });

                    gql(`query{Page(perPage:24){media(type:ANIME,sort:TRENDING_DESC){id title{romaji english}coverImage{large}}}}`).then(res => {
                        if (res && res.data && res.data.Page && res.data.Page.media) {
                            grid.innerHTML = ''; 
                            res.data.Page.media.forEach(m => {
                                const t = app.lang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                                grid.innerHTML += `
                                    <button onclick="nav('watch', {id:${m.id}})" class="text-left group animate-fade-in">
                                        <div class="aspect-[2/3] rounded-xl overflow-hidden mb-2 border border-white/5">
                                            <img src="${m.coverImage.large}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                                        </div>
                                        <p class="text-[9px] font-black uppercase truncate leading-none px-1 text-zinc-400 group-hover:text-white transition-colors">${t}</p>
                                    </button>
                                `;
                            });
                        }
                    }).catch(() => {});
                }
            } catch(error) {
                console.error("Fout tijdens renderen:", error);
            }
        }

        // --- BIBLIOTHEEK LAADPAGINA MET LOKALE CACHE EN TRAGE BATCHING (GEEN RATE LIMIT CRASHES!) ---
        async function renderLibraryGrid() {
            const grid = document.getElementById('xml-display-grid');
            if (!grid) return;

            let filteredXml = app.xmlLib;
            if(app.libraryFilter !== 'All') {
                filteredXml = app.xmlLib.filter(item => item.status === app.libraryFilter);
            }

            if(filteredXml.length === 0) {
                grid.className = "block text-center py-20 opacity-20";
                grid.innerHTML = `<p class="text-xs uppercase font-black">Geen items gevonden in deze map</p>`;
                return;
            }

            grid.className = "space-y-4 mt-2";
            grid.innerHTML = '';

            // Render alle kaarten direct (gebruikt direct reeds gesyncte posters)
            filteredXml.forEach(item => {
                grid.innerHTML += `
                    <div id="lib-card-${item.id}" data-id="${item.id}" data-mal="${item.malId || ''}" class="lazy-card card w-full p-4 flex flex-col sm:flex-row justify-between sm:items-center gap-4 border border-white/5 shadow-md animate-fade-in">
                        <div class="flex gap-4 items-center flex-1 min-w-0">
                            <img id="img-${item.id}" src="${item.coverImage || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=150'}" class="w-12 h-16 object-cover rounded-lg bg-zinc-900 border border-white/5 shadow flex-shrink-0">
                            <div class="truncate pr-4 flex-1">
                                <p class="text-white truncate font-bold text-sm mb-1">${item.title}</p>
                                <div class="flex items-center gap-2">
                                    <span class="text-[9px] bg-zinc-900 text-accent px-2 py-0.5 rounded font-black uppercase">${item.status}</span>
                                    <span class="text-[9px] text-zinc-500 font-bold uppercase">Progress: <span id="progress-val-${item.id}">${item.progress}</span> / <span id="eps-total-${item.id}">${item.episodes || '?'}</span></span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2 self-end sm:self-auto flex-shrink-0">
                            <button onclick="nav('watch', {id:${item.id}, ep:${item.progress || 1}})" class="bg-[#1a1a1a] hover:bg-accent hover:text-black px-4 py-2.5 rounded-xl text-xs text-zinc-400 font-bold transition-colors flex items-center gap-1.5"><i class="fa-solid fa-play text-[10px]"></i> Watch</button>
                            <button onclick="quickIncrement(${item.id})" class="bg-[#1a1a1a] hover:bg-zinc-800 px-4 py-2.5 rounded-xl text-xs text-zinc-400 font-black">+1 Ep</button>
                            <button onclick="changeLocalFolderPrompt(${item.id})" class="bg-[#1a1a1a] hover:bg-zinc-800 p-3 rounded-xl text-xs text-zinc-400"><i class="fa-solid fa-folder-open"></i></button>
                            <button onclick="window.deleteLocalItem(${item.id})" class="bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white p-3 rounded-xl text-xs transition-colors"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            if (lazyObserver) lazyObserver.disconnect();

            // Lazy-loading observer om alleen te laden wat in beeld verschijnt (Uitsluitend MAL/Jikan API)
            lazyObserver = new IntersectionObserver(async (entries) => {
                for (let entry of entries) {
                    if (entry.isIntersecting) {
                        const card = entry.target;
                        const id = card.getAttribute('data-id');
                        const malId = card.getAttribute('data-mal');
                        
                        lazyObserver.unobserve(card);

                        const item = app.xmlLib.find(it => it.id.toString() == id.toString());
                        if (item && (!item.coverImage || !item.episodes || item.episodes == 12)) {
                            // Exclusieve MAL/Jikan fetcher met Supabase Cloud-database Caching
                            const meta = await fetchMyAnimeListMetadata(id, malId, item.title);
                            if (meta) {
                                item.coverImage = meta.coverImage;
                                item.episodes = meta.episodes;
                                
                                if (item.status === "Watched" && item.progress == 0) {
                                    item.progress = meta.episodes;
                                    const progVal = document.getElementById(`progress-val-${id}`);
                                    if (progVal) progVal.innerText = meta.episodes;
                                }

                                const imgEl = document.getElementById(`img-${id}`);
                                const epsEl = document.getElementById(`eps-total-${id}`);
                                if (imgEl) imgEl.src = meta.coverImage;
                                if (epsEl) epsEl.innerText = meta.episodes;
                                
                                saveCloudDataDebounced();
                            }
                        }
                    }
                }
            }, { rootMargin: "100px 0px" });

            document.querySelectorAll('.lazy-card').forEach(card => {
                const id = card.getAttribute('data-id');
                const item = app.xmlLib.find(it => it.id.toString() == id.toString());
                if (item && (!item.coverImage || !item.episodes || item.episodes == 12)) {
                    lazyObserver.observe(card);
                }
            });
        }

        // --- FILTER FUNCTIES ---
        window.filterXml = function(status) {
            app.libraryFilter = status;
            render();
        };

        // --- BIBLIOTHEEK ACTIEHULPJES ---
        window.quickIncrement = function(id) {
            const item = app.xmlLib.find(item => item.id.toString() == id.toString());
            if (!item) return;
            const nextProgress = parseInt(item.progress || 0) + 1;
            window.autoUpdateProgressOnEpClick(id, item.title, nextProgress, item.episodes || 12, item.coverImage || '');
            render();
        };

        window.changeLocalFolderPrompt = function(id) {
            const item = app.xmlLib.find(i => i.id.toString() == id.toString());
            if (!item) return;
            const newStatus = prompt("Typ een nieuwe status (Watching, Watched, Dropped):", item.status);
            if (newStatus && ["Watching", "Watched", "Dropped"].includes(newStatus)) {
                window.autoUpdateProgressOnEpClick(id, item.title, item.progress, item.episodes || 12, item.coverImage || '');
                item.status = newStatus;
                saveCloudDataDebounced();
                render();
            } else if (newStatus) {
                window.showToast("Ongeldige status! Gebruik Watching, Watched of Dropped.", "error");
            }
        };

        // --- SKIP INTRO ---
        window.skipIntroTime = function() {
            const player = document.getElementById('player');
            if (player) {
                player.contentWindow.postMessage(JSON.stringify({
                    event: "command",
                    command: "seek",
                    value: app.skipSeconds
                }), "*");
                window.showToast(`Intro overgeslagen (+${app.skipSeconds}s)`);
            }
        };

        // --- SAVE SETTINGS ---
        window.saveSet = function() {
            const setContinueEl = document.getElementById('set-continue');
            const setAutoplayEl = document.getElementById('set-autoplay');
            const setAutonextEl = document.getElementById('set-autonext');
            const setAutoskipEl = document.getElementById('set-autoskip');
            const setSecondsEl = document.getElementById('set-seconds');
            const setUsernameEl = document.getElementById('set-user');
            const langCheckedEl = document.querySelector('input[name="lang"]:checked');
            const audioCheckedEl = document.querySelector('input[name="audio"]:checked');

            if (setUsernameEl) app.user = setUsernameEl.value.trim();
            if (langCheckedEl) app.lang = langCheckedEl.value;
            if (audioCheckedEl) app.defaultAudio = audioCheckedEl.value;
            if (setContinueEl) app.showContinue = setContinueEl.checked;
            if (setAutoplayEl) app.autoPlay = setAutoplayEl.checked;
            if (setAutonextEl) app.autoNext = setAutonextEl.checked;
            if (setAutoskipEl) app.autoSkipIntro = setAutoskipEl.checked;
            
            if (setSecondsEl) {
                const secondsVal = parseInt(setSecondsEl.value);
                app.skipSeconds = isNaN(secondsVal) ? 5 : secondsVal;
            }

            saveCloudData();
            window.showToast("Instellingen opgeslagen!");
            render();
        };

        // --- LIVE ANIME SEARCH ---
        window.liveSearch = function(e) {
            const val = e.target.value;
            if(!val) return;
            gql(`query($s:String){Page(perPage:18){media(search:$s,type:ANIME){id title{romaji english}coverImage{large}}}}`, {s: val}).then(res => {
                const grid = document.getElementById('search-grid');
                if(!grid || !res || !res.data) return; grid.innerHTML = '';
                res.data.Page.media.forEach(m => {
                    const t = app.lang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                    grid.innerHTML += `
                        <button onclick="nav('watch', {id:${m.id}})" class="text-left animate-fade-in">
                            <div class="aspect-[2/3] rounded-xl overflow-hidden mb-2 border border-white/5">
                                <img src="${m.coverImage.large}" class="w-full h-full object-cover">
                            </div>
                            <p class="text-[9px] font-black uppercase truncate leading-none px-1 text-zinc-400">${t}</p>
                        </button>
                    `;
                });
            });
        };

        // --- XML BACKUP DOWNLOADER (HIANIME FORMAT) ---
        window.exportMyAnimeListXML = function() {
            if(!app.xmlLib.length) {
                window.showToast("Geen items in je bibliotheek om te exporteren!", "error");
                return;
            }

            let xml = `<?xml version="1.0"?>\n`;
            xml += `<list>\n`;
            
            const folders = ["Watched", "Watching", "Dropped", "Plan to Watch"];
            folders.forEach(folder => {
                const items = app.xmlLib.filter(item => {
                    if (folder === "Watching" && item.status === "Watching") return true;
                    if (folder === "Watched" && item.status === "Watched") return true;
                    if (folder === "Dropped" && item.status === "Dropped") return true;
                    if (folder === "Plan to Watch" && item.status === "Plan to Watch") return true;
                    return false;
                });

                if (items.length > 0) {
                    xml += `  <folder>\n`;
                    xml += `    <name>${folder}</name>\n`;
                    xml += `    <data>\n`;
                    
                    items.forEach(item => {
                        xml += `      <item>\n`;
                        xml += `        <name>${item.title}</name>\n`;
                        xml += `        <url>https://hianime.dk/watch/${item.id}</url>\n`;
                        xml += `        <mal>https://myanimelist.net/anime/${item.id}</mal>\n`;
                        xml += `        <al>https://anilist.co/anime/${item.id}</al>\n`;
                        xml += `      </item>\n`;
                    });
                    
                    xml += `    </data>\n`;
                    xml += `  </folder>\n`;
                }
            });

            xml += `</list>\n`;

            const blob = new Blob([xml], { type: "text/xml" });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = `animemax_${app.user}_backup.xml`;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            URL.revokeObjectURL(url);
            window.showToast("XML Back-up gedownload!");
        };

        // --- INTELLIGENTE XML EN JSON IMPORTEER-ENGINE ---
        window.handleXML = function() {
            const file = document.getElementById('xml-input').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async e => {
                const content = e.target.result;
                try {
                    const jsonData = JSON.parse(content);
                    if (Array.isArray(jsonData)) {
                        app.xmlLib = jsonData;
                        saveCloudData();
                        window.showToast("Database succesvol geïmporteerd!");
                        nav('library');
                        return;
                    }
                } catch(err) {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(content, "text/xml");
                    
                    const folders = xmlDoc.getElementsByTagName("folder");
                    if (folders && folders.length > 0) {
                        let data = [];
                        for(let folder of folders) {
                            const statusName = folder.getElementsByTagName("name")[0].textContent;
                            const items = folder.getElementsByTagName("item");
                            for(let item of items) {
                                const alNode = item.getElementsByTagName("al")[0];
                                const malNode = item.getElementsByTagName("mal")[0];
                                let id = '';
                                let malId = '';
                                
                                if (alNode) {
                                    const idMatch = alNode.textContent.match(/anime\/(\d+)/);
                                    if (idMatch) id = idMatch[1];
                                }
                                if (malNode) {
                                    const malMatch = malNode.textContent.match(/anime\/(\d+)/);
                                    if (malMatch) malId = malMatch[1];
                                }

                                if (id) {
                                    const title = item.getElementsByTagName("name")[0].textContent;
                                    let progress = 0;
                                    let episodes = 12; 

                                    if (statusName === "Watched") {
                                        progress = 12; 
                                    }

                                    data.push({ 
                                        id: id, 
                                        malId: malId,
                                        title: title, 
                                        status: statusName, 
                                        progress: progress, 
                                        episodes: episodes,
                                        coverImage: '' 
                                    });
                                }
                            }
                        }
                        
                        app.xmlLib = mergeWatchlists(app.xmlLib, data);
                        saveCloudData();
                        window.showToast("HiAnime database geïmporteerd!");
                        nav('library');
                        return;
                    }

                    // MyAnimeList XML importer
                    const malAnimeList = xmlDoc.getElementsByTagName("anime");
                    if (malAnimeList && malAnimeList.length > 0) {
                        let data = [];
                        for(let animeNode of malAnimeList) {
                            const dbId = animeNode.getElementsByTagName("series_animedb_id")[0]?.textContent;
                            const seriesTitleNode = animeNode.getElementsByTagName("series_title")[0];
                            const title = seriesTitleNode ? seriesTitleNode.textContent : "Unknown Title";
                            const watchedEps = animeNode.getElementsByTagName("my_watched_episodes")[0]?.textContent || "0";
                            const totalEps = animeNode.getElementsByTagName("series_episodes")[0]?.textContent || "12";
                            const myStatus = animeNode.getElementsByTagName("my_status")[0]?.textContent || "Watching";

                            let statusStr = "Watching";
                            if (myStatus.toLowerCase() === "completed" || myStatus.toLowerCase() === "completed") statusStr = "Watched";
                            if (myStatus.toLowerCase() === "dropped") statusStr = "Dropped";
                            if (myStatus.toLowerCase() === "plan to watch" || myStatus.toLowerCase() === "planning") statusStr = "Plan to Watch";

                            if (dbId) {
                                data.push({
                                    id: dbId, malId: dbId, title: title, status: statusStr, progress: parseInt(watchedEps), episodes: parseInt(totalEps), coverImage: ''
                                });
                            }
                        }
                        app.xmlLib = mergeWatchlists(app.xmlLib, data);
                        saveCloudData();
                        window.showToast("MyAnimeList XML geïmporteerd!");
                        nav('library');
                        return;
                    }

                    window.showToast("Fout: XML formaat wordt niet herkend.", "error");
                }
            };
            reader.readAsText(file);
        }

        // AutoPlay Fix
        document.body.addEventListener('click', () => {
            const ifr = document.getElementById('player');
            if(ifr) {
                ifr.contentWindow.postMessage(JSON.stringify({event:"command",command:"unmute"}), "*");
                if (app.autoPlay) {
                    ifr.contentWindow.postMessage(JSON.stringify({event:"command",command:"play"}), "*");
                }
            }
        }, {once:true});

        // --- EVENT LISTENER VOOR MEGAPLAY EVENTS (Perfect hersteld voor realtime timer!) ---
        window.addEventListener("message", e => {
            let data = e.data;
            if (typeof data === "string") { 
                try { data = JSON.parse(data); } catch(err) {} 
            }
            
            // Controleer brede speler-events (zowel directe API properties als specifieke geneste timeupdates)
            const eventType = data.event || data.type || '';
            const currentTime = data.currentTime || data.value || (data.data ? data.data.currentTime : 0) || 0;
            const duration = data.duration || (data.data ? data.data.duration : 0) || 0;

            if (eventType === "timeupdate" || eventType === "time" || eventType === "progress") {
                currentPlaybackTime = parseFloat(currentTime);
                if (duration > 0) {
                    currentDuration = parseFloat(duration);
                }
                
                if (dubTimeout) {
                    clearTimeout(dubTimeout);
                    dubTimeout = null;
                }

                // Werk de indicator onmiddellijk en vloeiend in de UI bij
                const timeText = document.getElementById('playback-time-text');
                const progressPercent = document.getElementById('playback-progress-percentage');
                
                if (timeText && currentDuration > 0) {
                    timeText.innerText = `${formatDuration(currentPlaybackTime)} / ${formatDuration(currentDuration)}`;
                    const percent = Math.min(100, Math.max(0, Math.round((currentPlaybackTime / currentDuration) * 100)));
                    if (progressPercent) progressPercent.innerText = `${percent}%`;
                }
            }

            if (data.event === "error" && app.mode === "dub") {
                triggerDubFallback();
            }

            if(eventType === "complete" && app.autoNext) {
                saveCurrentVideoTime();
                const nextEp = app.ep + 1;
                const localItem = app.xmlLib.find(item => item.id == app.id);
                if (localItem) {
                    window.autoUpdateProgressOnEpClick(app.id, localItem.title, nextEp, localItem.episodes || 12, localItem.coverImage || '');
                }
                nav('watch', {id: app.id, ep: nextEp});
            }
        });
    </script>
</body>
</html>
