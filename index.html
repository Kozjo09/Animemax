<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimeMax Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Outfit:wght@900&display=swap');
        body { background: #060606; color: #f4f4f5; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .font-outfit { font-family: 'Outfit', sans-serif; }
        .accent { color: #cae962; }
        .bg-accent { background: #cae962; }
        .glass { background: rgba(6, 6, 6, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card-elite { background: #111; border-radius: 20px; border: 1px solid rgba(255,255,255,0.03); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .card-elite:hover { border-color: rgba(202, 233, 98, 0.4); transform: translateY(-3px); }
        .btn-filter { background: #1a1a1a; color: #666; font-weight: 800; text-transform: uppercase; font-size: 10px; padding: 12px 20px; border-radius: 12px; white-space: nowrap; transition: 0.2s; }
        .btn-filter.active { background: #cae962; color: #000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 20px; }
        .gradient-overlay { background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 50%, transparent 100%); }
        .ep-btn { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-weight: 900; font-size: 13px; transition: 0.2s; border: 1px solid rgba(255,255,255,0.05); }
        .toggle-checkbox:checked + .toggle-bg { background-color: #cae962; }
        .toggle-checkbox:checked + .toggle-bg .toggle-dot { transform: translateX(100%); background-color: #000; }
    </style>
</head>
<body class="pb-32">

    <!-- Header -->
    <header class="sticky top-0 z-[100] glass p-4">
        <div class="flex items-center justify-between max-w-7xl mx-auto mb-4">
            <button onclick="nav('home')" class="font-outfit text-2xl italic tracking-tighter uppercase leading-none">ANIME<span class="accent">MAX</span></button>
            <div class="flex items-center gap-4">
                <button onclick="nav('history')" class="text-zinc-500 hover:accent transition-colors"><i class="fa-solid fa-clock-rotate-left text-lg"></i></button>
                <button onclick="nav('profile')" id="prof-btn" class="w-10 h-10 rounded-full bg-zinc-900 border border-white/5 flex items-center justify-center">
                    <i class="fa-solid fa-user-ninja text-zinc-500"></i>
                </button>
            </div>
        </div>
        <div class="max-w-7xl mx-auto relative">
            <input type="text" id="search-input" placeholder="Search anime..." onkeyup="handleSearch(event)" class="w-full bg-black/40 border border-white/5 py-3 px-12 rounded-xl text-sm outline-none focus:border-accent/30 transition-all">
            <i class="fa-solid fa-search absolute left-5 top-4 text-zinc-600"></i>
        </div>
    </header>

    <main id="content" class="p-4 max-w-7xl mx-auto min-h-[70vh]">
        <!-- Dynamische weergave via JavaScript -->
    </main>

    <!-- Navigatiebalk onderaan -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass rounded-full p-2 flex justify-around items-center shadow-2xl border border-white/10 z-[1000]">
        <button onclick="nav('home')" class="p-4 nav-link" id="nav-home"><i class="fa-solid fa-house text-lg"></i></button>
        <button onclick="nav('cloud')" class="p-4 nav-link" id="nav-cloud"><i class="fa-solid fa-cloud text-lg"></i></button>
        <button onclick="nav('library')" class="p-4 nav-link" id="nav-library"><i class="fa-solid fa-layer-group text-lg"></i></button>
        <button onclick="nav('profile')" class="p-4 nav-link" id="nav-profile"><i class="fa-solid fa-user-ninja text-lg"></i></button>
    </nav>

    <script>
        const API = 'https://graphql.anilist.co';
        
        // Applicatiestatus (volledig lokaal opgeslagen)
        let app = {
            view: 'home',
            id: null,
            ep: 1,
            mode: 'sub',
            search: '',
            user: localStorage.getItem('amax_user') || '',
            titleLang: localStorage.getItem('amax_lang') || 'romaji', // 'romaji' of 'english'
            token: localStorage.getItem('al_token') || '',
            recent: JSON.parse(localStorage.getItem('amax_recent') || '[]'),
            xmlLib: JSON.parse(localStorage.getItem('amax_xml') || '[]')
        };

        // --- AUTOMATISCHE REDIRECT TOKEN DETECTIE ---
        if (window.location.hash.includes('access_token')) {
            const token = window.location.hash.match(/access_token=([^&]*)/)[1];
            localStorage.setItem('al_token', token);
            app.token = token;
            window.location.hash = ''; // Adresbalk opschonen
            alert("AniList succesvol gekoppeld!");
        }

        async function gql(query, variables) {
            const headers = { 'Content-Type': 'application/json' };
            if (app.token) {
                headers['Authorization'] = 'Bearer ' + app.token;
            }
            try {
                const r = await fetch(API, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ query, variables })
                });
                return r.json();
            } catch(e) { return null; }
        }

        function nav(view, params = {}) {
            app.view = view;
            app.id = params.id || null;
            app.ep = params.ep || 1;
            render();
            window.scrollTo(0, 0);
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                app.search = e.target.value;
                app.view = 'home';
                render();
            }
        }

        // --- GEHEUGEN EN VOORTGANG ---
        function saveRecent(id, title, img, ep) {
            let rec = app.recent.filter(i => i.id !== id);
            rec.unshift({ id, title, img, ep, ts: Date.now() });
            app.recent = rec.slice(0, 12);
            localStorage.setItem('amax_recent', JSON.stringify(app.recent));
        }

        // --- SCHERM-RENDERING ---
        function render() {
            const main = document.getElementById('content');
            
            // Activeer navigatie-icoon kleuren
            document.querySelectorAll('.nav-link').forEach(el => el.classList.add('text-zinc-600'));
            const activeNav = document.getElementById('nav-' + app.view);
            if (activeNav) {
                activeNav.classList.remove('text-zinc-600');
                activeNav.classList.add('accent');
            }
            document.getElementById('prof-btn').innerHTML = app.token ? `<i class="fa-solid fa-user-astronaut accent"></i>` : `<i class="fa-solid fa-user-ninja text-zinc-500"></i>`;

            if (app.view === 'watch') {
                main.innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-8">
                        <div class="flex-1">
                            <!-- Player frame -->
                            <div class="aspect-video w-full bg-black rounded-3xl overflow-hidden mb-6 shadow-2xl border border-white/5">
                                <iframe id="player" src="https://megaplay.buzz/stream/ani/${app.id}/${app.ep}/${app.mode}" allow="autoplay; fullscreen" scrolling="no"></iframe>
                            </div>

                            <!-- Spelerbediening -->
                            <div class="bg-[#111] p-4 rounded-2xl border border-white/5 mb-6 flex items-center justify-between">
                                <div class="flex gap-2">
                                    <button onclick="app.mode='sub';render()" class="px-5 py-2 rounded-lg text-[10px] font-black uppercase ${app.mode=='sub'?'bg-accent text-black':'bg-black text-zinc-500'}">Sub</button>
                                    <button onclick="app.mode='dub';render()" class="px-5 py-2 rounded-lg text-[10px] font-black uppercase ${app.mode=='dub'?'bg-accent text-black':'bg-black text-zinc-500'}">Dub</button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="checkbox" id="toggle-autonext" class="toggle-checkbox hidden">
                                        <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                        <span class="text-[9px] font-black uppercase text-zinc-400">Auto Next</span>
                                    </label>
                                    <button onclick="syncToCloud()" class="bg-black border border-accent/20 text-accent px-4 py-2 rounded-lg text-[9px] font-black uppercase"><i class="fa-solid fa-sync mr-1"></i> Sync Progress</button>
                                </div>
                            </div>

                            <h1 id="watch-title" class="text-2xl font-black accent uppercase italic mb-4 leading-tight">Loading...</h1>
                            <div id="genres" class="flex gap-2 mb-6 overflow-x-auto no-scrollbar"></div>
                            
                            <div class="mb-10 bg-zinc-900/20 p-6 rounded-[2rem] border border-white/5">
                                <div class="flex items-center justify-between mb-6">
                                    <h3 class="text-xs font-black uppercase tracking-widest text-zinc-400">Select Episode</h3>
                                    <button onclick="loadMoreEps()" class="text-[9px] font-black uppercase accent">+ Load More</button>
                                </div>
                                <div id="episodes-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-3"></div>
                            </div>
                        </div>

                        <div class="w-full lg:w-80">
                            <h3 class="text-xs font-black uppercase tracking-widest text-zinc-500 mb-6">Recommendations</h3>
                            <div id="related-list" class="space-y-4"></div>
                        </div>
                    </div>
                `;

                // Auto Next Status Herstellen
                const autoNext = document.getElementById('toggle-autonext');
                autoNext.checked = localStorage.getItem('amax_autonext') === 'true';
                autoNext.addEventListener('change', e => localStorage.setItem('amax_autonext', e.target.checked));

                // Informatie ophalen van AniList
                gql(`query($id:Int){Media(id:$id){title{romaji english}description episodes coverImage{large}genres recommendations{edges{node{mediaRecommendation{id title{romaji english}coverImage{large}}}}}}}}`, {id: parseInt(app.id)}).then(res => {
                    if(!res || !res.data) return;
                    const m = res.data.Media;
                    const title = app.titleLang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                    document.getElementById('watch-title').innerText = title;
                    
                    saveRecent(app.id, title, m.coverImage.large, app.ep);

                    const gen = document.getElementById('genres');
                    m.genres.forEach(g => gen.innerHTML += `<span class="text-[9px] font-black uppercase px-3 py-1 bg-zinc-900 text-zinc-500 rounded-lg">${g}</span>`);

                    // Renders Episode Grid
                    const grid = document.getElementById('episodes-grid');
                    const total = m.episodes || 24;
                    for (let i = 1; i <= total; i++) {
                        grid.innerHTML += `
                            <button onclick="nav('watch', {id:${app.id}, ep:${i}})" class="ep-btn ${i==app.ep?'bg-accent text-black shadow-[0_0_15px_rgba(202,233,98,0.5)] border-accent':'bg-[#1a1a1a] text-zinc-500 hover:text-white'}">
                                ${i}
                            </button>
                        `;
                    }

                    // Aanbevelingen bouwen
                    const relList = document.getElementById('related-list');
                    m.recommendations.edges.slice(0, 5).forEach(e => {
                        const r = e.node.mediaRecommendation;
                        if (!r) return;
                        const rTitle = app.titleLang === 'english' ? (r.title.english || r.title.romaji) : r.title.romaji;
                        relList.innerHTML += `
                            <button onclick="nav('watch', {id:${r.id}})" class="card-elite p-3 flex gap-4 items-center group w-full text-left">
                                <img src="${r.coverImage.large}" class="w-12 h-16 object-cover rounded-lg opacity-60">
                                <p class="text-[10px] font-black uppercase truncate group-hover:accent transition-colors">${rTitle}</p>
                            </button>
                        `;
                    });
                });
            }

            else if (app.view === 'profile') {
                container.innerHTML = `
                    <div class="max-w-md mx-auto space-y-6 pt-6">
                        <div class="card-elite p-8">
                            <h2 class="font-black accent uppercase italic mb-6">Settings</h2>
                            <div class="space-y-4">
                                <input type="text" id="set-user" value="${app.user}" placeholder="AniList Username..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-center outline-none font-bold">
                                <select id="set-lang" class="w-full bg-black border border-white/10 p-4 rounded-xl outline-none font-bold">
                                    <option value="romaji" ${app.titleLang=='romaji'?'selected':''}>Romaji (Original)</option>
                                    <option value="english" ${app.titleLang=='english'?'selected':''}>English Title</option>
                                </select>
                                <button onclick="saveSettings()" class="bg-accent text-black font-black py-4 rounded-xl w-full text-[10px] uppercase tracking-widest shadow-lg">Save Settings</button>
                            </div>
                        </div>

                        <div class="card-elite p-8 border border-blue-500/20">
                            <h2 class="font-black uppercase mb-2 text-sm text-center">AniList OAuth Link</h2>
                            <p class="text-[10px] text-zinc-500 uppercase text-center mb-6 leading-relaxed">No token pasting required. Redirect works automatically!</p>
                            <button onclick="redirectToAuth()" class="block w-full bg-white text-black text-center font-black py-4 rounded-xl text-[10px] uppercase">Link Account</button>
                        </div>

                        <div class="card-elite p-8 border-dashed border-zinc-800 text-center">
                            <h3 class="font-black uppercase text-zinc-500 mb-6">Import XML Watchlist</h3>
                            <input type="file" id="xml-input" class="text-[10px] text-zinc-500 mb-4 block mx-auto">
                            <button onclick="importXML()" class="w-full bg-zinc-800 text-white font-black py-3 rounded-xl text-[10px] uppercase">Upload Database</button>
                        </div>
                    </div>
                `;
            }

            else if (app.view === 'library') {
                container.innerHTML = `<h2 class="text-2xl font-outfit accent uppercase italic mb-6">Local <span class="text-white">Vault</span></h2><div class="space-y-4">`;
                if (!app.xmlLib.length) container.innerHTML += `<p class="opacity-30 text-xs text-center py-10 uppercase font-black">No XML data found. Upload in Profile.</p>`;
                
                // Groeperen op folder van de XML
                let grouped = { 'Watching': [], 'Watched': [], 'Dropped': [] };
                app.xmlLib.forEach(item => {
                    const status = item.status || 'Watching';
                    if (!grouped[status]) grouped[status] = [];
                    grouped[status].push(item);
                });

                Object.keys(grouped).forEach(folder => {
                    if (grouped[folder].length === 0) return;
                    container.innerHTML += `<h3 class="text-[10px] font-black uppercase text-zinc-500 tracking-[0.2em] mt-6 mb-3 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-zinc-800"></span> ${folder} (${grouped[folder].length})</h3>`;
                    grouped[folder].forEach(item => {
                        container.innerHTML += `
                            <button onclick="nav('watch', {id:${item.id}})" class="card-elite w-full p-4 flex justify-between items-center text-[11px] font-black uppercase text-left">
                                <span class="truncate pr-4">${item.title}</span>
                                <i class="fa-solid fa-play accent text-[8px]"></i>
                            </button>
                        `;
                    });
                });
                container.innerHTML += `</div>`;
            }

            else if (app.view === 'cloud') {
                if(!app.user) {
                    container.innerHTML = `<p class="text-center py-20 opacity-20 uppercase font-black text-xs">Set AniList Username in settings</p>`;
                    return;
                }
                container.innerHTML = `<h2 class="text-2xl font-outfit accent uppercase italic mb-6">Cloud <span class="text-white">Collection</span></h2><div id="c-list" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>`;
                gql(`query($u:String){MediaListCollection(userName:$u,type:ANIME){lists{name entries{progress media{id title{romaji english}coverImage{large}}}}}}`, {u: app.user}).then(res => {
                    const list = document.getElementById('c-list');
                    if (!res || !res.data) return;
                    res.data.MediaListCollection.lists.forEach(l => {
                        l.entries.forEach(e => {
                            const t = app.titleLang === 'english' ? (e.media.title.english || e.media.title.romaji) : e.media.title.romaji;
                            list.innerHTML += `
                                <button onclick="nav('watch', {id:${e.media.id}, ep:${e.progress+1}})" class="text-left">
                                    <div class="aspect-video rounded-xl overflow-hidden mb-2 relative bg-zinc-900 border border-white/5">
                                        <img src="${e.media.coverImage.large}" class="w-full h-full object-cover opacity-40">
                                        <div class="absolute inset-0 flex items-center justify-center flex-col gap-1">
                                            <span class="text-[8px] font-black accent uppercase bg-black/60 px-2 py-0.5 rounded">EP ${e.progress+1}</span>
                                        </div>
                                    </div>
                                    <p class="text-[9px] font-black uppercase truncate">${t}</p>
                                </button>
                            `;
                        });
                    });
                });
            }

            else if (app.view === 'history') {
                container.innerHTML = `<h2 class="text-2xl font-outfit accent uppercase italic mb-6">Recently <span class="text-white">Watched</span></h2><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">`;
                if (!app.recent.length) container.innerHTML += `<p class="opacity-20 py-10 uppercase font-black text-xs">History is empty</p>`;
                app.recent.forEach(r => {
                    container.innerHTML += `
                        <button onclick="nav('watch', {id:${r.id}, ep:${r.ep}})" class="card-elite p-4 flex gap-4 items-center w-full text-left">
                            <img src="${r.img}" class="w-12 h-16 object-cover rounded-lg opacity-60">
                            <div class="truncate">
                                <p class="text-xs font-black uppercase truncate accent">${r.title}</p>
                                <p class="text-[8px] font-bold text-zinc-500 uppercase mt-1">Aflevering ${r.ep}</p>
                            </div>
                        </button>
                    `;
                });
                container.innerHTML += `</div>`;
            }

            else {
                // HOME (Trending)
                container.innerHTML = `
                    <h2 class="text-xs font-black uppercase tracking-widest mb-6 flex items-center gap-2"><span class="w-1 h-4 bg-accent"></span> Trending</h2>
                    <div id="h-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4"></div>
                `;
                gql(`query($s:String){Page(perPage:24){media(search:$s,type:ANIME,sort:TRENDING_DESC){id title{romaji english}coverImage{large}}}}`, {s: app.search || null}).then(res => {
                    const grid = document.getElementById('h-grid');
                    if(!grid || !res || !res.data) return;
                    res.data.Page.media.forEach(m => {
                        const t = app.titleLang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                        grid.innerHTML += `
                            <button onclick="nav('watch', {id:${m.id}})" class="text-left group">
                                <div class="aspect-[2/3] rounded-2xl overflow-hidden mb-2 border border-white/5 card-elite">
                                    <img src="${m.coverImage.large}" class="w-full h-full object-cover">
                                </div>
                                <p class="text-[9px] font-black uppercase truncate leading-none px-1">${t}</p>
                            </button>
                        `;
                    });
                });
            }
        }

        async function syncToCloud() {
            if(!app.token) return alert("Link AniList in Profile first.");
            const q = `mutation($m:Int,$p:Int){SaveMediaListEntry(mediaId:$m,progress:$p,status:CURRENT){progress}}`;
            const res = await gql(q, {m: parseInt(app.id), p: parseInt(app.ep)});
            if(res && res.data) alert("Voortgang gesynchroniseerd!");
            else alert("Sync mislukt.");
        }

        function saveSettings() {
            app.user = document.getElementById('set-user').value;
            app.titleLang = document.getElementById('set-lang').value;
            localStorage.setItem('amax_user', app.user);
            localStorage.setItem('amax_lang', app.titleLang);
            alert("Settings Saved!");
            render();
        }

        function redirectToAuth() {
            const currentUrl = window.location.origin + window.location.pathname;
            const authUrl = `https://anilist.co/api/v2/oauth/authorize?client_id=20875&redirect_uri=${encodeURIComponent(currentUrl)}&response_type=token`;
            window.location.href = authUrl;
        }

        function importXML() {
            const file = document.getElementById('xml-input').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(e.target.result, "text/xml");
                const folders = xmlDoc.getElementsByTagName("folder");
                let data = [];
                for(let folder of folders) {
                    const statusName = folder.getElementsByTagName("name")[0].textContent;
                    const items = folder.getElementsByTagName("item");
                    for(let item of items) {
                        const al = item.getElementsByTagName("al")[0].textContent;
                        const idMatch = al.match(/anime\/(\d+)/);
                        if(idMatch) {
                            data.push({ id: idMatch[1], title: item.getElementsByTagName("name")[0].textContent, status: statusName });
                        }
                    }
                }
                app.xmlLib = data;
                localStorage.setItem('amax_xml', JSON.stringify(data));
                alert("Database Imported!");
                nav('library');
            };
            reader.readAsText(file);
        }

        // AutoPlay Fix: Unmute geluid bij de eerste interactie
        document.body.addEventListener('click', () => {
            const ifr = document.getElementById('player');
            if(ifr) {
                ifr.contentWindow.postMessage(JSON.stringify({event:"command",command:"unmute"}), "*");
            }
        }, {once:true});

        // Auto Next Event Listener
        window.addEventListener("message", e => {
            let data = e.data;
            if (typeof data === "string") { try { data = JSON.parse(data); } catch(err) {} }
            if(data.event === "complete" && localStorage.getItem('amax_autonext') === 'true') {
                nav('watch', {id: app.id, ep: app.ep + 1});
            }
        });

        render();
    </script>
</body>
</html>
