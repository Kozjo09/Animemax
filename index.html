<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimeMax Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { background: #080808; color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .accent { color: #cae962; }
        .bg-accent { background: #cae962; }
        .glass { background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card { background: #121212; border-radius: 18px; border: 1px solid rgba(255,255,255,0.03); transition: 0.2s; }
        .card:active { transform: scale(0.97); border-color: #cae962; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Toggle Switch CSS */
        .toggle-checkbox:checked + .toggle-bg { background-color: #cae962; }
        .toggle-checkbox:checked + .toggle-bg .toggle-dot { transform: translateX(100%); background-color: #000; }
    </style>
</head>
<body class="pb-32">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass p-4">
        <div class="flex items-center justify-between max-w-4xl mx-auto mb-4">
            <button onclick="nav('home')" class="text-2xl font-black italic uppercase tracking-tighter">ANIME<span class="accent">MAX</span></button>
            <div class="flex gap-3">
                <button onclick="nav('search')" class="w-10 h-10 rounded-full bg-[#121212] flex items-center justify-center border border-white/5"><i class="fa-solid fa-search text-xs"></i></button>
                <button onclick="nav('profile')" id="prof-btn" class="w-10 h-10 rounded-full bg-[#121212] flex items-center justify-center border border-white/10">
                    <i class="fa-solid fa-user-astronaut"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Hoofdinhoud -->
    <main id="content" class="p-4 max-w-4xl mx-auto min-h-[60vh]">
        <!-- Inhoud wordt hier geladen via JavaScript -->
    </main>

    <!-- Navigatiebalk onderaan -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[94%] max-w-sm glass rounded-[2.5rem] p-2 flex justify-around items-center shadow-2xl z-[100] border border-white/10">
        <button onclick="nav('home')" class="p-4 nav-link" id="nav-home"><i class="fa-solid fa-house"></i></button>
        <button onclick="nav('cloud')" class="p-4 nav-link" id="nav-cloud"><i class="fa-solid fa-cloud"></i></button>
        <button onclick="nav('library')" class="p-4 nav-link" id="nav-library"><i class="fa-solid fa-layer-group"></i></button>
        <button onclick="nav('profile')" class="p-4 nav-link" id="nav-profile"><i class="fa-solid fa-user-ninja"></i></button>
    </nav>

    <script>
        const API = 'https://graphql.anilist.co';
        
        // Laad token veilig in
        let savedToken = localStorage.getItem('al_token');
        if (savedToken === 'null' || savedToken === 'undefined' || !savedToken) {
            savedToken = '';
            localStorage.removeItem('al_token');
        }

        // Lokale App State laden
        let app = {
            view: 'home',
            id: null,
            ep: 1,
            mode: localStorage.getItem('amax_mode') || 'sub',
            searchQuery: '',
            
            // Instellingen (HiAnime Stijl)
            user: localStorage.getItem('amax_user') || '',
            clientId: localStorage.getItem('amax_client') || '41604', 
            clientSecret: localStorage.getItem('amax_secret') || '', // Jouw Client Secret van AniList
            showContinue: localStorage.getItem('amax_show_continue') !== 'false',
            lang: localStorage.getItem('amax_lang') || 'english',
            autoSelect: localStorage.getItem('amax_auto_select') || 'sub',
            autoPlay: localStorage.getItem('amax_autoplay') === 'true',
            autoNext: localStorage.getItem('amax_autonext') !== 'false',
            skipSeconds: parseInt(localStorage.getItem('amax_skip_seconds') || '5'),
            autoSkipIntro: localStorage.getItem('amax_autoskip') === 'true',
            
            token: savedToken,
            recent: JSON.parse(localStorage.getItem('amax_recent') || '[]'),
            xmlLib: JSON.parse(localStorage.getItem('amax_xml') || '[]'),
            
            // Actieve filter states
            cloudFilter: 'All',
            libraryFilter: 'All'
        };

        // --- AUTOMATISCHE AUTH CODE VERWERKING ---
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('code')) {
            const code = urlParams.get('code');
            // Schoon de URL direct op zodat de code niet in beeld blijft
            window.history.replaceState({}, document.title, window.location.origin + window.location.pathname);
            exchangeCodeForToken(code);
        }

        async function exchangeCodeForToken(code) {
            const redirectUri = window.location.origin + window.location.pathname;
            
            if (!app.clientId || !app.clientSecret) {
                alert("Fout: Zorg ervoor dat zowel je Client ID als Client Secret zijn opgeslagen in de instellingen!");
                nav('profile');
                return;
            }

            // Bouw de x-www-form-urlencoded parameters voor AniList OAuth token endpoint
            const params = new URLSearchParams();
            params.append('grant_type', 'authorization_code');
            params.append('client_id', app.clientId);
            params.append('client_secret', app.clientSecret);
            params.append('redirect_uri', redirectUri);
            params.append('code', code);

            try {
                const response = await fetch('https://anilist.co/api/v2/oauth/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json'
                    },
                    body: params
                });

                const data = await response.json();
                if (data.access_token) {
                    localStorage.setItem('al_token', data.access_token);
                    app.token = data.access_token;
                    
                    // Direct profielnaam ophalen met de nieuwe token
                    const userRes = await gql(`query { Viewer { name } }`);
                    if (userRes && userRes.data && userRes.data.Viewer) {
                        app.user = userRes.data.Viewer.name;
                        localStorage.setItem('amax_user', app.user);
                        alert(`Succesvol gekoppeld met account: ${app.user}!`);
                    } else {
                        alert("Succesvol verbonden met AniList!");
                    }
                    nav('cloud');
                } else {
                    alert("OAuth Error: " + (data.message || JSON.stringify(data)));
                }
            } catch (e) {
                console.error(e);
                alert("Er is een fout opgetreden bij het verbinden met AniList.");
            }
        }

        async function gql(query, vars) {
            const headers = { 'Content-Type': 'application/json' };
            const token = localStorage.getItem('al_token');
            if (token && token !== 'null' && token !== 'undefined') {
                headers['Authorization'] = 'Bearer ' + token;
            }
            try {
                const r = await fetch(API, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ query, variables: vars })
                });
                const res = await r.json();
                
                // Als de token verlopen of ongeldig is, gooi hem direct weg om de site te redden
                if (res && res.errors && res.errors.some(err => err.status === 401 || err.message.includes('Invalid token'))) {
                    localStorage.removeItem('al_token');
                    app.token = '';
                }
                return res;
            } catch(e) {
                console.error("GraphQL request mislukt: ", e);
                return null;
            }
        }

        function nav(view, params = {}) {
            app.view = view;
            app.id = params.id || null;
            app.ep = params.ep || 1;
            render();
            window.scrollTo(0,0);
        }

        function saveRecent(id, title, img, ep) {
            let rec = app.recent.filter(i => i.id != id);
            rec.unshift({id, title, img, ep, ts: Date.now()});
            app.recent = rec.slice(0, 12);
            localStorage.setItem('amax_recent', JSON.stringify(app.recent));
        }

        function render() {
            const main = document.getElementById('content');
            const hasToken = !!localStorage.getItem('al_token');
            
            // Update navigatie balk
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('accent'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.add('text-zinc-600'));
            const activeNav = document.getElementById('nav-' + app.view);
            if(activeNav) {
                activeNav.classList.add('accent');
                activeNav.classList.remove('text-zinc-600');
            }
            document.getElementById('prof-btn').classList.toggle('accent', hasToken);

            if (app.view === 'watch') {
                main.innerHTML = `
                    <div class="aspect-video w-full bg-black rounded-t-2xl overflow-hidden border border-white/10 shadow-2xl">
                        <iframe id="player" src="https://megaplay.buzz/stream/ani/${app.id}/${app.ep}/${app.mode}" allow="autoplay; fullscreen"></iframe>
                    </div>

                    <div class="bg-[#121212] p-4 rounded-b-2xl border border-white/10 mb-6 flex justify-between items-center flex-wrap gap-4 shadow-lg">
                        <div class="flex gap-2">
                            <button onclick="app.mode='sub';localStorage.setItem('amax_mode','sub');render()" class="px-4 py-2 rounded-lg text-[9px] font-black uppercase ${app.mode=='sub'?'bg-accent text-black':'bg-black text-zinc-500'}">Sub</button>
                            <button onclick="app.mode='dub';localStorage.setItem('amax_mode','dub');render()" class="px-4 py-2 rounded-lg text-[9px] font-black uppercase ${app.mode=='dub'?'bg-accent text-black':'bg-black text-zinc-500'}">Dub</button>
                        </div>
                        <div class="flex items-center gap-4">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="toggle-autonext" class="toggle-checkbox hidden">
                                <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                <span class="text-[9px] font-black uppercase text-zinc-400">Auto Next</span>
                            </label>
                            <button onclick="sync()" class="bg-black border border-accent/20 text-accent px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest"><i class="fa-solid fa-sync mr-1"></i> Sync</button>
                        </div>
                    </div>

                    <h1 id="w-title" class="text-xl font-black accent uppercase italic mb-6">Laden...</h1>
                    <div id="ep-grid" class="grid grid-cols-5 sm:grid-cols-10 gap-2 mb-8"></div>
                    <h2 class="text-[10px] font-black uppercase text-zinc-500 mb-4 tracking-widest">Related Seasons</h2>
                    <div id="rel-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                `;

                const autoNext = document.getElementById('toggle-autonext');
                autoNext.checked = localStorage.getItem('amax_autonext') !== 'false';
                autoNext.addEventListener('change', e => localStorage.setItem('amax_autonext', e.target.checked));

                gql(`query($id:Int){Media(id:$id){title{romaji english}episodes coverImage{large}relations{edges{relationType node{id type title{romaji english}}}}}}`, {id: parseInt(app.id)}).then(res => {
                    if (!res || !res.data) {
                        document.getElementById('w-title').innerText = "Informatie niet gevonden";
                        return;
                    }
                    const m = res.data.Media;
                    const title = app.lang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                    document.getElementById('w-title').innerText = title;
                    
                    saveRecent(app.id, title, m.coverImage.large, app.ep);

                    const grid = document.getElementById('ep-grid');
                    for(let i=1; i<=(m.episodes || 24); i++) {
                        grid.innerHTML += `<button onclick="nav('watch', {id:${app.id}, ep:${i}})" class="aspect-square rounded-lg font-black text-[10px] ${i==app.ep?'bg-accent text-black shadow-lg':'bg-zinc-900 text-zinc-500'}">${i}</button>`;
                    }

                    const relGrid = document.getElementById('rel-grid');
                    m.relations.edges.filter(e => e.node.type === 'ANIME').forEach(e => {
                        const rTitle = app.lang === 'english' ? (e.node.title.english || e.node.title.romaji) : e.node.title.romaji;
                        relGrid.innerHTML += `
                            <button onclick="nav('watch', {id:${e.node.id}})" class="card w-full p-4 flex justify-between items-center text-[10px] font-black uppercase text-left">
                                <div class="truncate pr-4">
                                    <p class="truncate text-white">${rTitle}</p>
                                    <p class="text-[7px] text-zinc-600 mt-0.5">${e.relationType.replace(/_/g, ' ')}</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-zinc-800 text-[10px]"></i>
                            </button>
                        `;
                    });
                });
            }

            else if (app.view === 'profile') {
                main.innerHTML = `
                    <div class="max-w-md mx-auto space-y-6">
                        <div class="card p-8 border border-accent/20 shadow-2xl">
                            <h2 class="font-black uppercase mb-6 text-sm flex items-center gap-2"><i class="fa-solid fa-sliders accent"></i> Settings</h2>
                            
                            <div class="space-y-4">
                                <label class="flex items-center justify-between p-2 cursor-pointer">
                                    <span class="text-xs font-black uppercase text-zinc-400">Show continue watching on home page</span>
                                    <input type="checkbox" id="set-continue" class="toggle-checkbox hidden" ${app.showContinue?'checked':''}>
                                    <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                </label>

                                <div class="flex items-center justify-between p-2">
                                    <span class="text-xs font-black uppercase text-zinc-400">Language for Anime Name</span>
                                    <div class="flex gap-4">
                                        <label class="flex items-center gap-1.5 text-xs font-bold"><input type="radio" name="lang" value="english" ${app.lang=='english'?'checked':''}> English</label>
                                        <label class="flex items-center gap-1.5 text-xs font-bold"><input type="radio" name="lang" value="japanese" ${app.lang=='japanese'?'checked':''}> Japanese</label>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between p-2">
                                    <span class="text-xs font-black uppercase text-zinc-400">Auto Select Language</span>
                                    <select id="set-select" class="bg-black border border-white/10 p-2 rounded-lg text-xs outline-none accent font-bold">
                                        <option value="sub" ${app.autoSelect=='sub'?'selected':''}>Only Sub</option>
                                        <option value="dub" ${app.autoSelect=='dub'?'selected':''}>Only Dub</option>
                                    </select>
                                </div>

                                <label class="flex items-center justify-between p-2 cursor-pointer">
                                    <span class="text-xs font-black uppercase text-zinc-400">Auto Play</span>
                                    <input type="checkbox" id="set-autoplay" class="toggle-checkbox hidden" ${app.autoPlay?'checked':''}>
                                    <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                </label>

                                <label class="flex items-center justify-between p-2 cursor-pointer">
                                    <span class="text-xs font-black uppercase text-zinc-400">Auto Next</span>
                                    <input type="checkbox" id="set-autonext" class="toggle-checkbox hidden" ${app.autoNext?'checked':''}>
                                    <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                </label>

                                <label class="flex items-center justify-between p-2 cursor-pointer">
                                    <span class="text-xs font-black uppercase text-zinc-400">Auto Skip Intro</span>
                                    <input type="checkbox" id="set-autoskip" class="toggle-checkbox hidden" ${app.autoSkipIntro?'checked':''}>
                                    <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                </label>

                                <div class="flex items-center justify-between p-2">
                                    <span class="text-xs font-black uppercase text-zinc-400">Skip seconds</span>
                                    <input type="number" id="set-seconds" value="${app.skipSeconds}" class="w-16 bg-black border border-white/10 p-2 rounded-lg text-center font-bold text-xs">
                                </div>

                                <!-- CLIENT ID EN CLIENT SECRET INVOERBOXEN -->
                                <div class="p-2 border-t border-white/5 pt-4">
                                    <label class="text-[9px] font-black uppercase text-zinc-500 block mb-1 accent">AniList Client ID</label>
                                    <input type="text" id="set-client" value="${app.clientId}" placeholder="Bijv. 41604" class="w-full bg-black border border-white/10 p-3 rounded-xl text-center outline-none font-bold text-xs text-white">
                                </div>

                                <div class="p-2">
                                    <label class="text-[9px] font-black uppercase text-zinc-500 block mb-1 accent">AniList Client Secret</label>
                                    <input type="password" id="set-secret" value="${app.clientSecret}" placeholder="Plak hier je Client Secret" class="w-full bg-black border border-white/10 p-3 rounded-xl text-center outline-none font-bold text-xs text-white">
                                </div>

                                <div class="p-2">
                                    <label class="text-[9px] font-black uppercase text-zinc-500 block mb-1">AniList Username</label>
                                    <input type="text" id="set-user" value="${app.user}" placeholder="Your Username" class="w-full bg-black border border-white/10 p-3 rounded-xl text-center outline-none font-bold text-xs">
                                </div>

                                <button onclick="saveSet()" class="bg-accent text-black font-black py-4 rounded-xl w-full text-[10px] uppercase tracking-widest mt-4">Save Settings</button>
                            </div>
                        </div>

                        <!-- One-Click Auto Auth -->
                        <div class="card p-8 border border-blue-500/20 text-center">
                            <h2 class="font-black uppercase mb-2 text-sm">AniList Sync</h2>
                            <p class="text-[9px] text-zinc-500 uppercase mb-6 leading-relaxed">Klik om in te loggen via de browser en je cloud-account te koppelen.</p>
                            <button onclick="redirectToAniList()" class="block w-full bg-white text-black text-center font-black py-4 rounded-xl text-[10px] uppercase tracking-widest hover:bg-zinc-100">Connect Account</button>
                        </div>

                        <!-- XML Upload -->
                        <div class="card p-8 border border-white/5 text-center">
                            <h2 class="font-black uppercase mb-4 text-sm">Import XML Watchlist</h2>
                            <input type="file" id="xml-input" class="text-[10px] text-zinc-500 mb-6 block mx-auto">
                            <button onclick="handleXML()" class="w-full bg-zinc-800 py-3 rounded-lg text-[10px] font-black uppercase border border-white/10">Upload Database</button>
                        </div>
                    </div>
                `;
            }

            else if (app.view === 'library') {
                // --- XML LIST FILTERS ---
                main.innerHTML = `
                    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                        <h2 class="text-xl font-black accent uppercase italic">Local Library</h2>
                        ${app.xmlLib.length ? `<button onclick="syncAllXmlToAniList()" class="bg-[#121212] hover:bg-accent hover:text-black border border-accent/25 text-accent text-[9px] font-black px-3 py-1.5 rounded-lg uppercase transition-all"><i class="fa-solid fa-cloud-arrow-up mr-1.5"></i> Sync Library to Cloud</button>` : ''}
                    </div>

                    <!-- Horizontale Filters -->
                    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-4 mb-2">
                        <button onclick="filterXml('All')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'All' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">All</button>
                        <button onclick="filterXml('Watching')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'Watching' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Watching</button>
                        <button onclick="filterXml('Watched')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'Watched' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Completed</button>
                        <button onclick="filterXml('Dropped')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'Dropped' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Dropped</button>
                    </div>

                    <div id="xml-display-grid" class="space-y-3 mt-2"></div>
                `;

                const grid = document.getElementById('xml-display-grid');
                if(!app.xmlLib.length) {
                    grid.innerHTML = `<p class="opacity-30 text-xs text-center py-10 uppercase font-black">Geen XML data gevonden. Importeer deze bij Profiel.</p>`;
                    return;
                }

                let filteredXml = app.xmlLib;
                if(app.libraryFilter !== 'All') {
                    filteredXml = app.xmlLib.filter(item => item.status === app.libraryFilter);
                }

                if(filteredXml.length === 0) {
                    grid.innerHTML = `<p class="opacity-20 text-xs text-center py-10 uppercase font-black">Geen items gevonden in deze map</p>`;
                    return;
                }

                filteredXml.forEach(item => {
                    grid.innerHTML += `
                        <button onclick="nav('watch', {id:${item.id}})" class="card w-full p-4 flex justify-between items-center text-[11px] font-black uppercase text-left mb-2">
                            <div class="truncate pr-4">
                                <p class="text-white truncate">${item.title}</p>
                                <p class="text-[7px] accent mt-1">${item.status}</p>
                            </div>
                            <i class="fa-solid fa-play accent text-[8px]"></i>
                        </button>
                    `;
                });
            }

            else if (app.view === 'cloud') {
                if(!hasToken) return main.innerHTML = `<p class="text-center py-20 opacity-20 uppercase font-black text-xs tracking-widest">Koppel je account bij Profiel</p>`;
                
                // --- CLOUD LIST FILTERS ---
                main.innerHTML = `
                    <h2 class="text-xl font-black accent uppercase italic mb-4">Cloud List</h2>
                    
                    <!-- Horizontale Filters -->
                    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-4 mb-2">
                        <button onclick="filterCloud('All')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.cloudFilter === 'All' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">All Lists</button>
                        <button onclick="filterCloud('Watching')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.cloudFilter === 'Watching' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Watching</button>
                        <button onclick="filterCloud('Completed')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.cloudFilter === 'Completed' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Completed</button>
                        <button onclick="filterCloud('Dropped')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.cloudFilter === 'Dropped' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Dropped</button>
                    </div>

                    <div id="c-list" class="grid grid-cols-2 gap-4"></div>
                `;

                gql(`query($u:String){MediaListCollection(userName:$u,type:ANIME){lists{name entries{progress media{id title{romaji english}coverImage{large}}}}}}`, {u: app.user}).then(res => {
                    const list = document.getElementById('c-list');
                    if (!res || !res.data) return;
                    
                    let itemsFound = false;
                    res.data.MediaListCollection.lists.forEach(l => {
                        const listName = l.name.toLowerCase();
                        const filterLower = app.cloudFilter.toLowerCase();
                        
                        if(app.cloudFilter !== 'All' && !listName.includes(filterLower)) return;

                        l.entries.forEach(e => {
                            itemsFound = true;
                            const t = app.lang === 'english' ? (e.media.title.english || e.media.title.romaji) : e.media.title.romaji;
                            list.innerHTML += `
                                <button onclick="nav('watch', {id:${e.media.id}, ep:${e.progress+1}})" class="text-left w-full">
                                    <div class="aspect-video rounded-xl overflow-hidden mb-2 relative bg-zinc-900 border border-white/5 shadow-lg">
                                        <img src="${e.media.coverImage.large}" class="w-full h-full object-cover opacity-50">
                                        <div class="absolute inset-0 flex items-center justify-center flex-col gap-1">
                                            <span class="text-[8px] font-black accent uppercase bg-black/60 px-2 py-1 rounded">Resume Ep ${e.progress+1}</span>
                                        </div>
                                    </div>
                                    <p class="text-[9px] font-black uppercase truncate text-zinc-300 leading-none mb-1">${t}</p>
                                    <p class="text-[7px] text-zinc-500 uppercase tracking-widest font-black">${l.name}</p>
                                </button>
                            `;
                        });
                    });

                    if(!itemsFound) {
                        list.className = "block text-center py-10 opacity-30";
                        list.innerHTML = `<p class="text-xs uppercase font-black">Geen anime gevonden in deze lijst</p>`;
                    }
                });
            }

            else if (app.view === 'search') {
                main.innerHTML = `
                    <div class="max-w-md mx-auto mb-10">
                        <input type="text" id="live-search" placeholder="Search titles..." onkeyup="liveSearch(event)" class="w-full bg-zinc-900/50 border border-white/10 p-4 rounded-xl outline-none font-bold text-sm focus:border-accent/40">
                    </div>
                    <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-6 gap-3"></div>
                `;
            }

            else {
                // HOME VIEW
                main.innerHTML = `
                    ${app.showContinue && app.recent.length ? `
                        <h2 class="text-[10px] font-black uppercase mb-4 opacity-50 tracking-widest">Continue Watching</h2>
                        <div class="flex gap-3 overflow-x-auto no-scrollbar mb-10">
                            ${app.recent.map(r => `
                                <button onclick="nav('watch', {id:${r.id}, ep:${r.ep}})" class="flex-shrink-0 w-40 group text-left animate-fade-in">
                                    <div class="aspect-video rounded-xl bg-zinc-900 border border-white/5 relative overflow-hidden mb-2">
                                        <img src="${r.img}" class="w-full h-full object-cover opacity-40 group-hover:scale-105 transition-transform duration-500">
                                        <div class="absolute bottom-2 right-2 bg-black/85 px-2 py-0.5 rounded text-[8px] font-black accent">EP ${r.ep}</div>
                                    </div>
                                    <p class="text-[9px] font-black uppercase truncate text-zinc-500 group-hover:text-white transition-colors">${r.title}</p>
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}
                    <h2 class="text-xs font-black uppercase tracking-widest mb-6">Trending Now</h2>
                    <div id="h-grid" class="grid grid-cols-2 sm:grid-cols-6 gap-3"></div>
                `;
                gql(`query{Page(perPage:24){media(type:ANIME,sort:TRENDING_DESC){id title{romaji english}coverImage{large}}}}`).then(res => {
                    const grid = document.getElementById('h-grid');
                    if(!grid || !res || !res.data) return;
                    res.data.Page.media.forEach(m => {
                        const t = app.lang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                        grid.innerHTML += `
                            <button onclick="nav('watch', {id:${m.id}})" class="text-left group animate-fade-in">
                                <div class="aspect-[2/3] rounded-xl overflow-hidden mb-2 border border-white/5">
                                    <img src="${m.coverImage.large}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                </div>
                                <p class="text-[9px] font-black uppercase truncate leading-none px-1 text-zinc-400 group-hover:text-white transition-colors">${t}</p>
                            </button>
                        `;
                    });
                });
            }
        }

        async function sync() {
            const hasToken = !!localStorage.getItem('al_token');
            if(!hasToken) return alert("Koppel eerst je AniList account in je profiel!");
            const q = `mutation($m:Int,$p:Int){SaveMediaListEntry(mediaId:$m,progress:$p,status:CURRENT){progress}}`;
            const r = await gql(q, {m: parseInt(app.id), p: parseInt(app.ep)});
            if(r && r.data) alert("Voortgang succesvol gesynchroniseerd met AniList!");
            else alert("Sync mislukt. Probeer opnieuw in te loggen.");
        }

        // --- FILTER FUNCTIONALITEIT ---
        function filterCloud(status) {
            app.cloudFilter = status;
            render();
        }

        function filterXml(status) {
            app.libraryFilter = status;
            render();
        }

        // --- XML TO ANILIST SYNC FEATURE ---
        async function syncAllXmlToAniList() {
            const hasToken = !!localStorage.getItem('al_token');
            if(!hasToken) {
                alert("Je bent niet ingelogd met AniList! Ga naar het profiel en koppel je account.");
                return;
            }

            if(!app.xmlLib.length) {
                alert("Geen geïmporteerde XML lijst gevonden om te synchroniseren.");
                return;
            }

            const confirmSync = confirm(`Weet je zeker dat je alle ${app.xmlLib.length} items uit je XML-bibliotheek wilt synchroniseren met je live AniList cloud-account? Dit zal de voortgang direct overschrijven.`);
            if(!confirmSync) return;

            alert("Synchronisatie is gestart! Sluit dit tabblad niet. Je krijgt een melding zodra alles is verwerkt...");

            const mutationQuery = `mutation($m:Int, $status:MediaListStatus){SaveMediaListEntry(mediaId:$m, status:$status){id}}`;
            
            let successCount = 0;
            let errorCount = 0;

            for(let item of app.xmlLib) {
                let aniStatus = "CURRENT"; 
                if (item.status === "Watched") aniStatus = "COMPLETED";
                if (item.status === "Dropped") aniStatus = "DROPPED";
                if (item.status === "Plan to Watch") aniStatus = "PLANNING";

                try {
                    const res = await gql(mutationQuery, {m: parseInt(item.id), status: aniStatus});
                    if(res && res.data) successCount++;
                    else errorCount++;
                } catch(e) {
                    errorCount++;
                }
                // Rate limits omzeilen
                await new Promise(resolve => setTimeout(resolve, 350));
            }

            alert(`Synchronisatie voltooid!\n\nSuccesvol bijgewerkt: ${successCount} anime\nMislukt of overgeslagen: ${errorCount}`);
            nav('cloud');
        }

        function saveSet() {
            app.user = document.getElementById('set-user').value;
            app.clientId = document.getElementById('set-client').value || '41604';
            app.clientSecret = document.getElementById('set-secret').value || '';
            app.lang = document.querySelector('input[name="lang"]:checked').value;
            app.autoSelect = document.getElementById('set-select').value;
            app.showContinue = document.getElementById('set-continue').checked;
            app.autoPlay = document.getElementById('set-autoplay').checked;
            app.autoNext = document.getElementById('set-autonext').checked;
            app.autoSkipIntro = document.getElementById('set-autoskip').checked;
            app.skipSeconds = parseInt(document.getElementById('set-seconds').value || '5');

            localStorage.setItem('amax_user', app.user);
            localStorage.setItem('amax_client', app.clientId);
            localStorage.setItem('amax_secret', app.clientSecret);
            localStorage.setItem('amax_lang', app.lang);
            localStorage.setItem('amax_auto_select', app.autoSelect);
            localStorage.setItem('amax_show_continue', app.showContinue);
            localStorage.setItem('amax_autoplay', app.autoPlay);
            localStorage.setItem('amax_autonext', app.autoNext);
            localStorage.setItem('amax_autoskip', app.autoSkipIntro);
            localStorage.setItem('amax_skip_seconds', app.skipSeconds);

            alert("Instellingen opgeslagen!");
            render();
        }

        function redirectToAniList() {
            const currentUrl = window.location.origin + window.location.pathname;
            // Dit roept AniList aan met de code-methode in plaats van de token-methode
            const authUrl = `https://anilist.co/api/v2/oauth/authorize?client_id=${app.clientId}&redirect_uri=${encodeURIComponent(currentUrl)}&response_type=code`;
            window.location.href = authUrl;
        }

        function liveSearch(e) {
            const val = e.target.value;
            if(!val) return;
            gql(`query($s:String){Page(perPage:18){media(search:$s,type:ANIME){id title{romaji english}coverImage{large}}}}`, {s: val}).then(res => {
                const grid = document.getElementById('search-grid');
                if(!grid || !res || !res.data) return; grid.innerHTML = '';
                res.data.Page.media.forEach(m => {
                    const t = app.lang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                    grid.innerHTML += `
                        <button onclick="nav('watch', {id:${m.id}})" class="text-left animate-fade-in">
                            <div class="aspect-[2/3] rounded-xl overflow-hidden mb-2 border border-white/5">
                                <img src="${m.coverImage.large}" class="w-full h-full object-cover">
                            </div>
                            <p class="text-[9px] font-black uppercase truncate leading-none px-1 text-zinc-400">${t}</p>
                        </button>
                    `;
                });
            });
        }

        function handleXML() {
            const file = document.getElementById('xml-input').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(e.target.result, "text/xml");
                const folders = xmlDoc.getElementsByTagName("folder");
                let data = [];
                for(let folder of folders) {
                    const statusName = folder.getElementsByTagName("name")[0].textContent;
                    const items = folder.getElementsByTagName("item");
                    for(let item of items) {
                        const al = item.getElementsByTagName("al")[0].textContent;
                        const idMatch = al.match(/anime\/(\d+)/);
                        if(idMatch) {
                            data.push({ id: idMatch[1], title: item.getElementsByTagName("name")[0].textContent, status: statusName });
                        }
                    }
                }
                app.xmlLib = data;
                localStorage.setItem('amax_xml', JSON.stringify(data));
                alert("Watchlist geïmporteerd!");
                nav('library');
            };
            reader.readAsText(file);
        }

        // AutoPlay Fix
        document.body.addEventListener('click', () => {
            const ifr = document.getElementById('player');
            if(ifr) {
                ifr.contentWindow.postMessage(JSON.stringify({event:"command",command:"unmute"}), "*");
                if (app.autoPlay) {
                    ifr.contentWindow.postMessage(JSON.stringify({event:"command",command:"play"}), "*");
                }
            }
        }, {once:true});

        // Event Listener voor de Megaplay API (Auto Next)
        window.addEventListener("message", e => {
            let data = e.data;
            if (typeof data === "string") { try { data = JSON.parse(data); } catch(err) {} }
            if(data.event === "complete" && localStorage.getItem('amax_autonext') !== 'false') {
                nav('watch', {id: app.id, ep: app.ep + 1});
            }
        });

        render();
    </script>
</body>
</html>
