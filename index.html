<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimeMax Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Officiële Supabase Browser Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { background: #080808; color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .accent { color: #cae962; }
        .bg-accent { background: #cae962; color: #000; }
        .glass { background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card { background: #121212; border-radius: 18px; border: 1px solid rgba(255,255,255,0.03); transition: 0.2s; }
        .card:active { transform: scale(0.97); border-color: #cae962; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Toggle Switch */
        .toggle-checkbox:checked + .toggle-bg { background-color: #cae962; }
        .toggle-checkbox:checked + .toggle-bg .toggle-dot { transform: translateX(100%); background-color: #000; }
        
        /* Simpele, gegarandeerd werkende slide-down animatie voor toasts */
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-toast { animation: slideDown 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-32 relative">

    <!-- Toast Meldingen Container (Perfect gecentreerd bovenaan) -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Bevestigingsmodal -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[10000] hidden items-center justify-center p-4">
        <div class="bg-[#121212] border border-white/5 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h3 id="confirm-title" class="text-lg font-black uppercase tracking-wider mb-2">Bevestigen</h3>
            <p id="confirm-message" class="text-zinc-400 text-xs leading-relaxed mb-6"></p>
            <div class="flex gap-3">
                <button id="confirm-cancel-btn" class="flex-1 bg-zinc-900 border border-white/5 py-3 rounded-xl text-xs font-black uppercase">Annuleren</button>
                <button id="confirm-ok-btn" class="flex-1 bg-accent text-black py-3 rounded-xl text-xs font-black uppercase">Bevestigen</button>
            </div>
        </div>
    </div>

    <!-- Header (Zichtbaar na inloggen) -->
    <header id="app-header" class="sticky top-0 z-50 glass p-4 hidden">
        <div class="flex items-center justify-between max-w-4xl mx-auto mb-4">
            <button onclick="nav('home')" class="text-2xl font-black italic uppercase tracking-tighter">ANIME<span class="accent">MAX</span></button>
            <div class="flex gap-3 items-center">
                <button onclick="nav('search')" class="w-10 h-10 rounded-full bg-[#121212] flex items-center justify-center border border-white/5"><i class="fa-solid fa-search text-xs"></i></button>
                <button onclick="nav('profile')" id="prof-btn" class="w-10 h-10 rounded-full bg-[#121212] flex items-center justify-center border border-white/10 text-zinc-600">
                    <i class="fa-solid fa-user-astronaut"></i>
                </button>
                <button onclick="logout()" class="w-10 h-10 rounded-full bg-red-950/40 hover:bg-red-900 border border-red-900/30 flex items-center justify-center text-red-400 transition-colors" title="Uitloggen"><i class="fa-solid fa-sign-out-alt text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- Hoofdinhoud -->
    <main id="content" class="p-4 max-w-4xl mx-auto min-h-[60vh]">
        <div class="text-center py-24">
            <i class="fa-solid fa-circle-notch animate-spin text-4xl accent mb-4"></i>
            <p class="text-xs uppercase tracking-widest text-zinc-500 animate-pulse">Laden en cloud-database verbinden...</p>
        </div>
    </main>

    <!-- Bottom Navigatiebalk -->
    <nav id="app-navigation" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[94%] max-w-sm glass rounded-[2.5rem] p-2 flex justify-around items-center shadow-2xl z-[100] border border-white/10 hidden">
        <button onclick="nav('home')" class="p-4 nav-link" id="nav-home"><i class="fa-solid fa-house"></i></button>
        <button onclick="nav('cloud')" class="p-4 nav-link" id="nav-cloud"><i class="fa-solid fa-cloud"></i></button>
        <button onclick="nav('library')" class="p-4 nav-link" id="nav-library"><i class="fa-solid fa-layer-group"></i></button>
        <button onclick="nav('profile')" class="p-4 nav-link" id="nav-profile"><i class="fa-solid fa-user-ninja"></i></button>
    </nav>

    <script>
        const ANILIST_API = 'https://graphql.anilist.co';
        
        // Jouw werkende Supabase Database instellingen!
        const SUPABASE_URL = "https://zieuivzmzzxbraefeovl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EpN5OqgyzVvorrR27-V2MA_ZPCnD7He";
        
        let sb = null;
        let sessionData = null;

        // Globale App Toestand
        let app = {
            view: 'home', id: null, ep: 1, mode: 'sub', searchQuery: '', cloudFilter: 'All', libraryFilter: 'All',
            user: 'Kozjo09', showContinue: true, lang: 'english', autoPlay: true, autoNext: true, autoSkipIntro: false, skipSeconds: 5, 
            defaultAudio: 'sub', recent: [], xmlLib: []
        };

        // --- CUSTOM TOAST NOTIFICATIES ---
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-between shadow-2xl border text-center animate-toast pointer-events-auto ${
                type === 'error' ? 'bg-red-950/95 text-red-400 border-red-500/20' : 'bg-zinc-900/95 text-accent border-accent/20'
            }`;
            toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="ml-4 opacity-50 hover:opacity-100"><i class="fa-solid fa-times"></i></button>`;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
        };

        window.showConfirm = function(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const titleEl = document.getElementById('confirm-title');
            const messageEl = document.getElementById('confirm-message');
            const cancelBtn = document.getElementById('confirm-cancel-btn');
            const okBtn = document.getElementById('confirm-ok-btn');

            titleEl.textContent = title;
            messageEl.textContent = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const close = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            };

            cancelBtn.onclick = () => close();
            okBtn.onclick = () => { close(); onConfirm(); };
        };

        // --- INITIALISATIE MET RLS EN AUTH ---
        window.onload = async () => {
            try {
                if (typeof window.supabase !== 'undefined') {
                    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                } else if (typeof supabase !== 'undefined') {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                } else {
                    throw new Error("Supabase library niet geladen");
                }

                const { data: { session } } = await sb.auth.getSession();
                if (session) {
                    sessionData = session;
                    if(session.user && session.user.email) {
                        app.user = session.user.email.split('@')[0];
                    }
                    await loadCloudData();
                } else {
                    showLoginPage('login');
                }
            } catch(e) {
                console.error("Database initialisatiefout: ", e);
                showLoginPage('login');
            }
        };

        // --- INLOGGEN EN REGISTREREN ---
        function showLoginPage(mode = 'login') {
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('app-navigation').classList.add('hidden');
            const main = document.getElementById('content');
            if(!main) return;
            
            if (mode === 'register') {
                main.innerHTML = `
                    <div class="max-w-md mx-auto mt-16 p-8 card border border-white/5 shadow-2xl">
                        <h2 class="text-3xl font-black italic accent uppercase tracking-tighter mb-2 text-center">ANIME<span class="text-white">MAX</span></h2>
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest text-center mb-8">Maak een nieuw cloud-profiel aan</p>
                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] font-black uppercase text-zinc-400 block mb-1">Gebruikersnaam</label>
                                <input type="text" id="auth-username" class="w-full bg-zinc-900 border border-white/5 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                            </div>
                            <div>
                                <label class="text-[10px] font-black uppercase text-zinc-400 block mb-1">Wachtwoord</label>
                                <input type="password" id="auth-password" class="w-full bg-zinc-900 border border-white/5 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                            </div>
                            <button onclick="handleAuth('reg')" class="bg-accent text-black font-black py-4 rounded-xl w-full text-xs uppercase tracking-widest">Account Aanmaken</button>
                            <p class="text-center text-xs text-zinc-500 mt-4">Heb je al een account? <button onclick="showLoginPage('login')" class="accent font-bold hover:underline">Inloggen</button></p>
                        </div>
                    </div>
                `;
            } else {
                main.innerHTML = `
                    <div class="max-w-md mx-auto mt-16 p-8 card border border-white/5 shadow-2xl">
                        <h2 class="text-3xl font-black italic accent uppercase tracking-tighter mb-2 text-center">ANIME<span class="text-white">MAX</span></h2>
                        <p class="text-[10px] text-zinc-500 uppercase tracking-widest text-center mb-8">Log in op je cloud-profiel</p>
                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] font-black uppercase text-zinc-400 block mb-1">Gebruikersnaam</label>
                                <input type="text" id="auth-username" class="w-full bg-zinc-900 border border-white/5 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                            </div>
                            <div>
                                <label class="text-[10px] font-black uppercase text-zinc-400 block mb-1">Wachtwoord</label>
                                <input type="password" id="auth-password" class="w-full bg-zinc-900 border border-white/5 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                            </div>
                            <button onclick="handleAuth('login')" class="bg-accent text-black font-black py-4 rounded-xl w-full text-xs uppercase tracking-widest">Inloggen</button>
                            <p class="text-center text-xs text-zinc-500 mt-4">Nieuwe gebruiker? <button onclick="showLoginPage('register')" class="accent font-bold hover:underline">Registreer hier</button></p>
                        </div>
                    </div>
                `;
            }
        }

        async function handleAuth(type, explicitUser = null, explicitPass = null) {
            const u = explicitUser || document.getElementById('auth-username').value.trim();
            const p = explicitPass || document.getElementById('auth-password').value.trim();
            if (!u || !p) return window.showToast("Vul alle velden in!", "error");

            const email = `${u.toLowerCase()}@animemax.local`;
            app.user = u; 

            if (type === 'reg') {
                const { data, error } = await sb.auth.signUp({ email, password: p });
                if (error) {
                    window.showToast("Registratie mislukt of naam bezet.", "error");
                    return;
                }
                
                if (data.user) {
                    const { error: insertErr } = await sb.from('anime_users').insert([{
                        id: data.user.id, username: u, watchlist: [], recent: []
                    }]);
                    if(insertErr) console.error("Profiel insert fout:", insertErr);
                }
                window.showToast("Geregistreerd! Je kunt nu inloggen.");
                showLoginPage('login');
            } else {
                const { data, error } = await sb.auth.signInWithPassword({ email, password: p });
                if (error) {
                    window.showToast("Gebruikersnaam of wachtwoord onjuist.", "error");
                    return;
                }
                sessionData = data.session;
                await loadCloudData();
            }
        }

        async function loadCloudData() {
            if (!sessionData) return;
            const { data, error } = await sb.from('anime_users').select('*').eq('id', sessionData.user.id).single();
            
            if (data) {
                app.xmlLib = data.watchlist || [];
                app.recent = data.recent || [];
                if (data.settings) {
                    app.defaultAudio = data.settings.defaultAudio || 'sub';
                    app.mode = app.defaultAudio; // Zet de start-modus naar de voorkeur van de gebruiker
                    app.user = data.settings.user || app.user;
                    app.showContinue = data.settings.showContinue !== false;
                    app.lang = data.settings.lang || 'english';
                    app.autoPlay = data.settings.autoPlay !== false;
                    app.autoNext = data.settings.autoNext !== false;
                    app.autoSkipIntro = data.settings.autoSkipIntro === true;
                    app.skipSeconds = parseInt(data.settings.skipSeconds || '5');
                }
            }

            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('app-navigation').classList.remove('hidden');
            window.showToast(`Welkom terug, ${app.user}!`);
            nav('home');
        }

        async function saveCloudData() {
            if (!sessionData) return;
            const { error } = await sb.from('anime_users').update({
                watchlist: app.xmlLib,
                recent: app.recent,
                settings: {
                    defaultAudio: app.defaultAudio,
                    user: app.user,
                    showContinue: app.showContinue,
                    lang: app.lang,
                    autoPlay: app.autoPlay,
                    autoNext: app.autoNext,
                    autoSkipIntro: app.autoSkipIntro,
                    skipSeconds: app.skipSeconds
                }
            }).eq('id', sessionData.user.id);
            if (error) console.error("Cloud opslaan mislukt:", error);
        }

        async function logout() {
            await sb.auth.signOut();
            sessionData = null;
            showLoginPage('login');
        }

        // --- GRAPHQL API CALL HELPER ---
        async function gql(query, vars) {
            const headers = { 'Content-Type': 'application/json' };
            try {
                const r = await fetch(ANILIST_API, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ query, variables: vars })
                });
                return await r.json();
            } catch(e) {
                console.error("GraphQL API Fout: ", e);
                return null;
            }
        }

        function nav(view, params = {}) {
            if (!sessionData) return showLoginPage('login');
            app.view = view;
            app.id = params.id || null;
            app.ep = params.ep || 1;
            
            // Als we naar een video gaan, reset de mode naar de standaard audiosetting
            if (view === 'watch') {
                app.mode = app.defaultAudio;
            }
            
            render();
            window.scrollTo(0,0);
        }

        function saveRecent(id, title, img, ep) {
            let rec = app.recent.filter(i => i.id != id);
            rec.unshift({id, title, img, ep, ts: Date.now()});
            app.recent = rec.slice(0, 12);
            saveCloudData();
        }

        // --- UPDATE WATCHLIST & EPISODES ---
        window.updateLocalItem = function(id, title, status, progress, totalEpisodes = 12) {
            let found = false;
            app.xmlLib = app.xmlLib.map(item => {
                if (item.id == id) {
                    found = true;
                    return { ...item, status, progress: parseInt(progress), episodes: totalEpisodes };
                }
                return item;
            });

            if (!found) {
                app.xmlLib.push({ id: id.toString(), title: title, status: status, progress: parseInt(progress), episodes: totalEpisodes });
            }

            saveCloudData();
            window.showToast("Opgeslagen in de cloud!");
            render();
        };

        window.deleteLocalItem = function(id) {
            window.showConfirm(
                "Item Verwijderen",
                "Weet je zeker dat je deze anime uit je bibliotheek wilt verwijderen?",
                () => {
                    app.xmlLib = app.xmlLib.filter(item => item.id != id);
                    saveCloudData();
                    render();
                }
            );
        };

        function render() {
            if (!sessionData) return showLoginPage('login');
            const main = document.getElementById('content');
            if(!main) return;
            
            // Sync bottom-nav buttons
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('accent'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.add('text-zinc-600'));
            const activeNav = document.getElementById('nav-' + app.view);
            if(activeNav) {
                activeNav.classList.add('accent');
                activeNav.classList.remove('text-zinc-600');
            }
            document.getElementById('prof-btn').classList.add('accent');

            try {
                if (app.view === 'watch') {
                    main.innerHTML = `
                        <div class="aspect-video w-full bg-black rounded-t-2xl overflow-hidden border border-white/10 shadow-2xl animate-fade-in relative">
                            <iframe id="player" src="https://megaplay.buzz/stream/ani/${app.id}/${app.ep}/${app.mode}" allow="autoplay; fullscreen"></iframe>
                            
                            <!-- Custom Skip Intro Button -->
                            ${app.autoSkipIntro ? `
                                <button onclick="skipIntroTime()" class="absolute bottom-16 right-4 bg-black/85 border border-[#cae962]/30 text-[#cae962] text-[10px] font-black uppercase tracking-widest px-4 py-2.5 rounded-xl flex items-center gap-2 transition-all active:scale-95 shadow-2xl z-50">
                                    <i class="fa-solid fa-forward-fast"></i> Skip (+${app.skipSeconds}s)
                                </button>
                            ` : ''}
                        </div>

                        <div class="bg-[#121212] p-4 rounded-b-2xl border border-white/10 mb-6 flex justify-between items-center flex-wrap gap-4 shadow-lg">
                            <div class="flex gap-2">
                                <button onclick="app.mode='sub';render()" class="px-4 py-2 rounded-lg text-[9px] font-black uppercase ${app.mode=='sub'?'bg-accent text-black':'bg-black text-zinc-500'}">Japans (Sub)</button>
                                <button onclick="app.mode='dub';render()" class="px-4 py-2 rounded-lg text-[9px] font-black uppercase ${app.mode=='dub'?'bg-accent text-black':'bg-black text-zinc-500'}">Engels (Dub)</button>
                            </div>
                            <div class="flex items-center gap-4">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="toggle-autonext" class="toggle-checkbox hidden">
                                    <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                    <span class="text-[9px] font-black uppercase text-zinc-400">Auto Next</span>
                                </label>
                            </div>
                        </div>

                        <h1 id="w-title" class="text-xl font-black accent uppercase italic mb-4">Laden...</h1>
                        
                        <div id="local-status-card" class="bg-[#121212] p-4 rounded-xl border border-white/5 mb-6 flex flex-wrap gap-4 items-center justify-between shadow-lg">
                            <div>
                                <p class="text-[9px] font-black text-zinc-500 uppercase tracking-widest">Jouw Status (Cloud)</p>
                                <h3 id="local-status-text" class="text-xs font-bold text-white mt-1">Laden...</h3>
                            </div>
                            <div class="flex gap-2 flex-wrap">
                                <select id="local-status-select" class="bg-black text-white text-xs border border-white/10 rounded-lg p-2 font-bold outline-none">
                                    <option value="Watching">Watching</option>
                                    <option value="Watched">Completed</option>
                                    <option value="Dropped">Dropped</option>
                                </select>
                                <input type="number" id="local-progress-input" value="0" class="bg-black text-white text-xs border border-white/10 rounded-lg p-2 w-16 text-center font-bold outline-none">
                                <button id="local-save-btn" class="bg-accent text-black px-4 py-2 rounded-lg text-xs font-black uppercase">Opslaan</button>
                            </div>
                        </div>

                        <div id="ep-grid" class="grid grid-cols-5 sm:grid-cols-10 gap-2 mb-8"></div>
                        <h2 class="text-[10px] font-black uppercase text-zinc-500 mb-4 tracking-widest">Related Seasons</h2>
                        <div id="rel-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                    `;

                    const autoNext = document.getElementById('toggle-autonext');
                    autoNext.checked = app.autoNext;
                    autoNext.addEventListener('change', e => { 
                        app.autoNext = e.target.checked; 
                        saveCloudData(); 
                    });

                    gql(`query($id:Int){Media(id:$id){title{romaji english}episodes coverImage{large}relations{edges{relationType node{id type title{romaji english}}}}}}`, {id: parseInt(app.id)}).then(res => {
                        if (!res || !res.data) {
                            document.getElementById('w-title').innerText = "Informatie niet gevonden";
                            return;
                        }
                        const m = res.data.Media;
                        const title = app.lang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                        document.getElementById('w-title').innerText = title;
                        
                        saveRecent(app.id, title, m.coverImage.large, app.ep);

                        const localItem = app.xmlLib.find(item => item.id == app.id);
                        const statusText = document.getElementById('local-status-text');
                        const selectEl = document.getElementById('local-status-select');
                        const progressInput = document.getElementById('local-progress-input');
                        const saveBtn = document.getElementById('local-save-btn');

                        if (localItem) {
                            statusText.innerHTML = `<span class="accent">${localItem.status}</span> - Aflevering ${localItem.progress} / ${m.episodes || '?'}`;
                            selectEl.value = localItem.status;
                            progressInput.value = localItem.progress;
                        } else {
                            statusText.innerHTML = `<span class="text-zinc-500">Niet in je bibliotheek</span>`;
                            progressInput.value = app.ep;
                        }

                        saveBtn.onclick = () => {
                            window.updateLocalItem(app.id, title, selectEl.value, progressInput.value, m.episodes || 12);
                        };

                        const grid = document.getElementById('ep-grid');
                        for(let i=1; i<=(m.episodes || 24); i++) {
                            grid.innerHTML += `<button onclick="nav('watch', {id:${app.id}, ep:${i}})" class="aspect-square rounded-lg font-black text-[10px] ${i==app.ep?'bg-accent text-black shadow-lg':'bg-zinc-900 text-zinc-500'}">${i}</button>`;
                        }

                        const relGrid = document.getElementById('rel-grid');
                        m.relations.edges.filter(e => e.node.type === 'ANIME').forEach(e => {
                            const rTitle = app.lang === 'english' ? (e.node.title.english || e.node.title.romaji) : e.node.title.romaji;
                            relGrid.innerHTML += `
                                <button onclick="nav('watch', {id:${e.node.id}})" class="card w-full p-4 flex justify-between items-center text-[10px] font-black uppercase text-left">
                                    <div class="truncate pr-4">
                                        <p class="truncate text-white">${rTitle}</p>
                                        <p class="text-[7px] text-zinc-600 mt-0.5">${e.relationType.replace(/_/g, ' ')}</p>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-zinc-800 text-[10px]"></i>
                                </button>
                            `;
                        });
                    });
                }

                else if (app.view === 'profile') {
                    // Profile screen ZONDER delete account module
                    main.innerHTML = `
                        <div class="max-w-md mx-auto space-y-6 animate-fade-in">
                            <div class="card p-8 border border-accent/20 shadow-2xl">
                                <div class="flex items-center justify-between mb-6 border-b border-white/5 pb-4">
                                    <h2 class="font-black uppercase text-sm flex items-center gap-2"><i class="fa-solid fa-sliders accent"></i> Settings</h2>
                                    <span class="bg-accent/10 border border-accent/20 text-accent text-[9px] px-3 py-1 rounded-full uppercase font-black">User: ${app.user}</span>
                                </div>
                                
                                <div class="space-y-4">
                                    <!-- Continue Watching instelling -->
                                    <label class="flex items-center justify-between p-2 cursor-pointer">
                                        <span class="text-xs font-black uppercase text-zinc-400">Show continue watching on home</span>
                                        <input type="checkbox" id="set-continue" class="toggle-checkbox hidden" ${app.showContinue?'checked':''}>
                                        <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                    </label>

                                    <!-- Auto Play instelling -->
                                    <label class="flex items-center justify-between p-2 cursor-pointer">
                                        <span class="text-xs font-black uppercase text-zinc-400">Auto Play video</span>
                                        <input type="checkbox" id="set-autoplay" class="toggle-checkbox hidden" ${app.autoPlay?'checked':''}>
                                        <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                    </label>

                                    <!-- Auto Next instelling -->
                                    <label class="flex items-center justify-between p-2 cursor-pointer">
                                        <span class="text-xs font-black uppercase text-zinc-400">Auto Next episode</span>
                                        <input type="checkbox" id="set-autonext" class="toggle-checkbox hidden" ${app.autoNext?'checked':''}>
                                        <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                    </label>

                                    <!-- Auto Skip Intro instelling -->
                                    <label class="flex items-center justify-between p-2 cursor-pointer">
                                        <span class="text-xs font-black uppercase text-zinc-400">Enable skip intro button</span>
                                        <input type="checkbox" id="set-autoskip" class="toggle-checkbox hidden" ${app.autoSkipIntro?'checked':''}>
                                        <div class="w-8 h-4 bg-zinc-800 rounded-full relative toggle-bg transition-all"><div class="w-4 h-4 bg-white rounded-full absolute left-0 toggle-dot transition-transform"></div></div>
                                    </label>

                                    <!-- Skip intro seconden -->
                                    <div class="flex items-center justify-between p-2">
                                        <span class="text-xs font-black uppercase text-zinc-400">Skip intro seconds</span>
                                        <input type="number" id="set-seconds" value="${app.skipSeconds}" class="w-16 bg-black border border-white/10 p-2 rounded-lg text-center font-bold text-xs outline-none font-sans">
                                    </div>

                                    <!-- Standaard Audio (Sub of Dub) -->
                                    <div class="flex items-center justify-between p-2 border-t border-white/5 pt-4">
                                        <span class="text-xs font-black uppercase text-zinc-400">Default Audio</span>
                                        <div class="flex gap-4">
                                            <label class="flex items-center gap-1.5 text-xs font-bold cursor-pointer"><input type="radio" name="audio" value="sub" ${app.defaultAudio=='sub'?'checked':''}> Sub</label>
                                            <label class="flex items-center gap-1.5 text-xs font-bold cursor-pointer"><input type="radio" name="audio" value="dub" ${app.defaultAudio=='dub'?'checked':''}> Dub</label>
                                        </div>
                                    </div>

                                    <!-- Taal anime titels -->
                                    <div class="flex items-center justify-between p-2">
                                        <span class="text-xs font-black uppercase text-zinc-400">Language for Anime Name</span>
                                        <div class="flex gap-4">
                                            <label class="flex items-center gap-1.5 text-xs font-bold cursor-pointer"><input type="radio" name="lang" value="english" ${app.lang=='english'?'checked':''}> English</label>
                                            <label class="flex items-center gap-1.5 text-xs font-bold cursor-pointer"><input type="radio" name="lang" value="japanese" ${app.lang=='japanese'?'checked':''}> Japanese</label>
                                        </div>
                                    </div>

                                    <!-- AniList username sync -->
                                    <div class="p-2 border-t border-white/5 pt-4">
                                        <label class="text-[9px] font-black uppercase text-zinc-500 block mb-1">AniList Username (Voor openbare sync)</label>
                                        <input type="text" id="set-user" value="${app.user}" placeholder="Your Username" class="w-full bg-black border border-white/10 p-3 rounded-xl text-center outline-none font-bold text-xs text-white">
                                    </div>

                                    <button onclick="saveSet()" class="bg-accent text-black font-black py-4 rounded-xl w-full text-xs uppercase tracking-widest mt-4 hover:opacity-90 transition-all">Save Settings</button>
                                </div>
                            </div>

                            <!-- EXPORT NAAR MYANIMELIST XML COMPATIBEL FORMAAT -->
                            <div class="card p-8 border border-green-500/20 text-center">
                                <h2 class="font-black uppercase mb-2 text-sm">Download MAL-XML Exporteer</h2>
                                <p class="text-[9px] text-zinc-500 uppercase mb-6 leading-relaxed">Exporteer je eigen cloud-database direct als MyAnimeList XML-bestand!</p>
                                <button onclick="exportMyAnimeListXML()" class="block w-full bg-zinc-900 hover:bg-accent hover:text-black text-white font-black py-4 rounded-xl text-[10px] uppercase tracking-widest border border-white/15 transition-all">
                                    <i class="fa-solid fa-file-export mr-1.5"></i> Download MyAnimeList XML
                                </button>
                            </div>

                            <!-- XML Upload (MAL of HiAnime) -->
                            <div class="card p-8 border border-white/5 text-center">
                                <h2 class="font-black uppercase mb-4 text-sm">Import XML / JSON Watchlist (HiAnime & MAL)</h2>
                                <input type="file" id="xml-input" class="text-[10px] text-zinc-500 mb-6 block mx-auto">
                                <button onclick="handleXML()" class="w-full bg-zinc-800 py-3 rounded-lg text-[10px] font-black uppercase border border-white/10">Upload Database</button>
                            </div>
                        </div>
                    `;
                }

                else if (app.view === 'library') {
                    main.innerHTML = `
                        <div class="flex items-center justify-between mb-4 flex-wrap gap-2 animate-fade-in">
                            <h2 class="text-xl font-black accent uppercase italic">Local Library</h2>
                            <span class="text-[10px] text-zinc-500 uppercase font-black">${app.xmlLib.length} items</span>
                        </div>

                        <!-- Horizontale Filters -->
                        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-4 mb-4">
                            <button onclick="filterXml('All')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'All' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">All</button>
                            <button onclick="filterXml('Watching')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'Watching' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Watching</button>
                            <button onclick="filterXml('Watched')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'Watched' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Completed</button>
                            <button onclick="filterXml('Dropped')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.libraryFilter === 'Dropped' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Dropped</button>
                        </div>

                        <div id="xml-display-grid" class="space-y-3 mt-2"></div>
                    `;

                    const grid = document.getElementById('xml-display-grid');
                    if(!app.xmlLib.length) {
                        grid.innerHTML = `<p class="opacity-30 text-xs text-center py-10 uppercase font-black">Geen data gevonden. Importeer een XML/JSON bestand of begin met kijken!</p>`;
                        return;
                    }

                    let filteredXml = app.xmlLib;
                    if(app.libraryFilter !== 'All') {
                        filteredXml = app.xmlLib.filter(item => item.status === app.libraryFilter);
                    }

                    if(filteredXml.length === 0) {
                        grid.innerHTML = `<p class="opacity-20 text-xs text-center py-10 uppercase font-black">Geen items gevonden in deze map</p>`;
                        return;
                    }

                    filteredXml.forEach(item => {
                        grid.innerHTML += `
                            <div class="card w-full p-4 flex flex-col sm:flex-row justify-between sm:items-center gap-3 border border-white/5 shadow-md animate-fade-in">
                                <div class="truncate pr-4 flex-1">
                                    <p class="text-white truncate font-bold text-sm mb-1">${item.title}</p>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[9px] bg-zinc-900 text-accent px-2 py-0.5 rounded font-black uppercase">${item.status}</span>
                                        <span class="text-[9px] text-zinc-500 font-bold uppercase">Progress: ${item.progress} / ${item.episodes || '?'}</span>
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-2 self-end sm:self-auto">
                                    <button onclick="nav('watch', {id:${item.id}, ep:${item.progress || 1}})" class="bg-[#1a1a1a] hover:bg-accent hover:text-black p-2.5 rounded-lg text-xs text-zinc-400 transition-colors"><i class="fa-solid fa-play"></i> Watch</button>
                                    <button onclick="quickIncrement(${item.id})" class="bg-[#1a1a1a] hover:bg-zinc-800 p-2.5 rounded-lg text-xs text-zinc-400 font-black" title="Volgende aflevering">+1 Ep</button>
                                    <button onclick="changeLocalFolderPrompt(${item.id})" class="bg-[#1a1a1a] hover:bg-zinc-800 p-2.5 rounded-lg text-xs text-zinc-400"><i class="fa-solid fa-folder-open"></i></button>
                                    <button onclick="window.deleteLocalItem(${item.id})" class="bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white p-2.5 rounded-lg text-xs transition-colors"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }

                else if (app.view === 'cloud') {
                    if(!app.user) return main.innerHTML = `<p class="text-center py-20 opacity-20 uppercase font-black text-xs tracking-widest">Voeg je AniList gebruikersnaam toe bij Instellingen</p>`;
                    
                    main.innerHTML = `
                        <div class="flex items-center justify-between mb-4 animate-fade-in">
                            <h2 class="text-xl font-black accent uppercase italic">Cloud List: ${app.user}</h2>
                        </div>
                        
                        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-4 mb-2">
                            <button onclick="filterCloud('All')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.cloudFilter === 'All' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">All Lists</button>
                            <button onclick="filterCloud('Watching')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.cloudFilter === 'Watching' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Watching</button>
                            <button onclick="filterCloud('Completed')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.cloudFilter === 'Completed' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Completed</button>
                            <button onclick="filterCloud('Dropped')" class="flex-shrink-0 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-wider ${app.cloudFilter === 'Dropped' ? 'bg-accent text-black shadow-lg' : 'bg-zinc-900 text-zinc-400 border border-white/5'}">Dropped</button>
                        </div>

                        <div id="c-list" class="grid grid-cols-2 gap-4">Laden...</div>
                    `;

                    gql(`query($u:String){MediaListCollection(userName:$u,type:ANIME){lists{name entries{progress media{id title{romaji english}coverImage{large}episodes}}}}}`, {u: app.user}).then(res => {
                        const list = document.getElementById('c-list');
                        if (!res || !res.data || !res.data.MediaListCollection) {
                            list.innerHTML = `<p class="col-span-2 text-center py-10 opacity-30 text-xs font-black uppercase">Kon de openbare AniList van ${app.user} niet vinden of laden.</p>`;
                            return;
                        }
                        
                        list.innerHTML = '';
                        let itemsFound = false;
                        res.data.MediaListCollection.lists.forEach(l => {
                            const listName = l.name.toLowerCase();
                            const filterLower = app.cloudFilter.toLowerCase();
                            
                            if(app.cloudFilter !== 'All' && !listName.includes(filterLower)) return;

                            l.entries.forEach(e => {
                                itemsFound = true;
                                const t = app.lang === 'english' ? (e.media.title.english || e.media.title.romaji) : e.media.title.romaji;
                                list.innerHTML += `
                                    <div class="text-left w-full group relative animate-fade-in">
                                        <button onclick="nav('watch', {id:${e.media.id}, ep:${e.progress+1}})" class="w-full text-left">
                                            <div class="aspect-video rounded-xl overflow-hidden mb-2 relative bg-zinc-900 border border-white/5">
                                                <img src="${e.media.coverImage.large}" class="w-full h-full object-cover opacity-50 group-hover:scale-105 transition-transform duration-300">
                                                <div class="absolute inset-0 flex items-center justify-center flex-col gap-1">
                                                    <span class="text-[8px] font-black accent uppercase bg-black/60 px-2 py-1 rounded">Resume Ep ${e.progress+1}</span>
                                                </div>
                                            </div>
                                            <p class="text-[9px] font-black uppercase truncate text-zinc-300 leading-none mb-1">${t}</p>
                                            <p class="text-[7px] text-zinc-500 uppercase tracking-widest font-black mb-2">${l.name}</p>
                                        </button>
                                        
                                        <button onclick="importSingleCloudItem(${e.media.id}, '${t.replace(/'/g, "\\'")}', '${l.name}', ${e.progress}, ${e.media.episodes || 12})" class="absolute top-2 right-2 bg-black/90 hover:bg-accent hover:text-black border border-white/10 text-white p-1.5 rounded text-[8px] font-black uppercase transition-all shadow-md">
                                            <i class="fa-solid fa-cloud-arrow-down mr-1"></i> Import
                                        </button>
                                    </div>
                                `;
                            });
                        });

                        if(!itemsFound) {
                            list.className = "block text-center py-10 opacity-30";
                            list.innerHTML = `<p class="text-xs uppercase font-black">Geen anime gevonden in deze lijst</p>`;
                        }
                    });
                }

                else if (app.view === 'search') {
                    main.innerHTML = `
                        <div class="max-w-md mx-auto mb-10">
                            <input type="text" id="live-search" placeholder="Zoek op titel..." onkeyup="liveSearch(event)" class="w-full bg-zinc-900/50 border border-white/10 p-4 rounded-xl outline-none focus:border-accent text-white font-bold">
                        </div>
                        <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-6 gap-3"></div>
                    `;
                }

                else {
                    // HOME VIEW (Continue Watching + Trending)
                    main.innerHTML = `
                        ${app.showContinue && app.recent.length ? `
                            <h2 class="text-[10px] font-black uppercase mb-4 opacity-50 tracking-widest">Continue Watching (Cloud)</h2>
                            <div class="flex gap-3 overflow-x-auto no-scrollbar mb-10">
                                ${app.recent.map(r => `
                                    <button onclick="nav('watch', {id:${r.id}, ep:${r.ep}})" class="flex-shrink-0 w-40 group text-left animate-fade-in">
                                        <div class="aspect-video rounded-xl bg-zinc-900 border border-white/5 relative overflow-hidden mb-2">
                                            <img src="${r.img}" class="w-full h-full object-cover opacity-50 group-hover:scale-105 transition-transform duration-500">
                                            <div class="absolute bottom-2 right-2 bg-black/85 px-2 py-0.5 rounded text-[8px] font-black accent">EP ${r.ep}</div>
                                        </div>
                                        <p class="text-[9px] font-black uppercase truncate text-zinc-400 group-hover:text-white transition-colors">${r.title}</p>
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                        <h2 class="text-xs font-black uppercase tracking-widest mb-6">Trending Now</h2>
                        <div id="h-grid" class="grid grid-cols-2 sm:grid-cols-6 gap-3"></div>
                    `;
                    gql(`query{Page(perPage:24){media(type:ANIME,sort:TRENDING_DESC){id title{romaji english}coverImage{large}}}}`).then(res => {
                        const grid = document.getElementById('h-grid');
                        if(!grid || !res || !res.data) return;
                        res.data.Page.media.forEach(m => {
                            const t = app.lang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                            grid.innerHTML += `
                                <button onclick="nav('watch', {id:${m.id}})" class="text-left group animate-fade-in">
                                    <div class="aspect-[2/3] rounded-xl overflow-hidden mb-2 border border-white/5">
                                        <img src="${m.coverImage.large}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    </div>
                                    <p class="text-[9px] font-black uppercase truncate leading-none px-1 text-zinc-400 group-hover:text-white transition-colors">${t}</p>
                                </button>
                            `;
                        });
                    });
                }
            } catch(error) {
                console.error("Fout tijdens renderen:", error);
            }
        }

        // --- SKIP INTRO LOGICA (Zowel handmatig als auto-skip) ---
        window.skipIntroTime = function() {
            const player = document.getElementById('player');
            if (player) {
                player.contentWindow.postMessage(JSON.stringify({
                    event: "command",
                    command: "seek",
                    value: app.skipSeconds
                }), "*");
                window.showToast(`Intro overgeslagen (+${app.skipSeconds}s)`);
            }
        };

        // --- SAVE PROFILE SETTINGS ---
        window.saveSet = function() {
            const setContinueEl = document.getElementById('set-continue');
            const setAutoplayEl = document.getElementById('set-autoplay');
            const setAutonextEl = document.getElementById('set-autonext');
            const setAutoskipEl = document.getElementById('set-autoskip');
            const setSecondsEl = document.getElementById('set-seconds');
            const setUsernameEl = document.getElementById('set-user');
            const langCheckedEl = document.querySelector('input[name="lang"]:checked');
            const audioCheckedEl = document.querySelector('input[name="audio"]:checked');

            if (setUsernameEl) app.user = setUsernameEl.value.trim();
            if (langCheckedEl) app.lang = langCheckedEl.value;
            if (audioCheckedEl) app.defaultAudio = audioCheckedEl.value;
            if (setContinueEl) app.showContinue = setContinueEl.checked;
            if (setAutoplayEl) app.autoPlay = setAutoplayEl.checked;
            if (setAutonextEl) app.autoNext = setAutonextEl.checked;
            if (setAutoskipEl) app.autoSkipIntro = setAutoskipEl.checked;
            
            if (setSecondsEl) {
                const secondsVal = parseInt(setSecondsEl.value);
                app.skipSeconds = isNaN(secondsVal) ? 5 : secondsVal;
            }

            saveCloudData();
            window.showToast("Instellingen opgeslagen!");
            render();
        };

        // --- LIVE ANIME SEARCH ---
        window.liveSearch = function(e) {
            const val = e.target.value;
            if(!val) return;
            gql(`query($s:String){Page(perPage:18){media(search:$s,type:ANIME){id title{romaji english}coverImage{large}}}}`, {s: val}).then(res => {
                const grid = document.getElementById('search-grid');
                if(!grid || !res || !res.data) return; grid.innerHTML = '';
                res.data.Page.media.forEach(m => {
                    const t = app.lang === 'english' ? (m.title.english || m.title.romaji) : m.title.romaji;
                    grid.innerHTML += `
                        <button onclick="nav('watch', {id:${m.id}})" class="text-left animate-fade-in">
                            <div class="aspect-[2/3] rounded-xl overflow-hidden mb-2 border border-white/5">
                                <img src="${m.coverImage.large}" class="w-full h-full object-cover">
                            </div>
                            <p class="text-[9px] font-black uppercase truncate leading-none px-1 text-zinc-400">${t}</p>
                        </button>
                    `;
                });
            });
        };

        // --- XML EN JSON WATCHLIST IMPORTEER-ENGINE (HiAnime & MyAnimeList) ---
        window.handleXML = function() {
            const file = document.getElementById('xml-input').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const content = e.target.result;
                try {
                    const jsonData = JSON.parse(content);
                    if (Array.isArray(jsonData)) {
                        app.xmlLib = jsonData;
                        saveCloudData();
                        window.showToast("Database succesvol geïmporteerd!");
                        nav('library');
                        return;
                    }
                } catch(err) {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(content, "text/xml");
                    
                    const malAnimeList = xmlDoc.getElementsByTagName("anime");
                    if (malAnimeList && malAnimeList.length > 0) {
                        let data = [];
                        for(let animeNode of malAnimeList) {
                            const dbId = animeNode.getElementsByTagName("series_animedb_id")[0]?.textContent;
                            const seriesTitleNode = animeNode.getElementsByTagName("series_title")[0];
                            const title = seriesTitleNode ? seriesTitleNode.textContent : "Unknown Title";
                            const watchedEps = animeNode.getElementsByTagName("my_watched_episodes")[0]?.textContent || "0";
                            const totalEps = animeNode.getElementsByTagName("series_episodes")[0]?.textContent || "0";
                            const myStatus = animeNode.getElementsByTagName("my_status")[0]?.textContent || "Watching";

                            let statusStr = "Watching";
                            if (myStatus.toLowerCase() === "completed") statusStr = "Watched";
                            if (myStatus.toLowerCase() === "dropped") statusStr = "Dropped";
                            if (myStatus.toLowerCase() === "plan to watch" || myStatus.toLowerCase() === "planning") statusStr = "Plan to Watch";

                            if (dbId) {
                                data.push({
                                    id: dbId, title: title, status: statusStr, progress: parseInt(watchedEps), episodes: parseInt(totalEps)
                                });
                            }
                        }
                        app.xmlLib = data;
                        saveCloudData();
                        window.showToast(`MyAnimeList XML geïmporteerd (${data.length} items)!`);
                        nav('library');
                        return;
                    }

                    const folders = xmlDoc.getElementsByTagName("folder");
                    if (folders && folders.length > 0) {
                        let data = [];
                        for(let folder of folders) {
                            const statusName = folder.getElementsByTagName("name")[0].textContent;
                            const items = folder.getElementsByTagName("item");
                            for(let item of items) {
                                const al = item.getElementsByTagName("al")[0].textContent;
                                const idMatch = al.match(/anime\/(\d+)/);
                                if(idMatch) {
                                    data.push({ 
                                        id: idMatch[1], title: item.getElementsByTagName("name")[0].textContent, status: statusName, progress: 0, episodes: 12
                                    });
                                }
                            }
                        }
                        app.xmlLib = data;
                        saveCloudData();
                        window.showToast(`HiAnime XML geïmporteerd (${data.length} items)!`);
                        nav('library');
                        return;
                    }

                    window.showToast("Fout: XML formaat wordt niet herkend.", "error");
                }
            };
            reader.readAsText(file);
        }

        // AutoPlay Fix
        document.body.addEventListener('click', () => {
            const ifr = document.getElementById('player');
            if(ifr) {
                ifr.contentWindow.postMessage(JSON.stringify({event:"command",command:"unmute"}), "*");
                if (app.autoPlay) {
                    ifr.contentWindow.postMessage(JSON.stringify({event:"command",command:"play"}), "*");
                }
            }
        }, {once:true});

        // Event Listener voor Megaplay Auto Next
        window.addEventListener("message", e => {
            let data = e.data;
            if (typeof data === "string") { try { data = JSON.parse(data); } catch(err) {} }
            if(data.event === "complete" && app.autoNext) {
                nav('watch', {id: app.id, ep: app.ep + 1});
            }
        });
    </script>
</body>
</html>
